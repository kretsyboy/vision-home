<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="description" content="SiteVue.AR Home: a visionOS-style Home View, apps and Control Center for the Meta Ray-Ban Display lens, driven by the Meta Neural Band.">
<meta name="application-name" content="SiteVue.AR Home">
<meta name="mrbd-web-app-capable" content="yes">
<link rel="icon" href="icon-96.png" sizes="96x96">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07060d">
<title>SiteVue.AR Home</title>
<style>
/* 600x600 additive waveguide: black = transparent, so "glass" is a dim lit fill, never a backdrop blur. */
:root{
  --accent:#64d2ff; --ts:1; --bright:1;
  --glass-a:rgba(255,255,255,.12); --glass-b:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.14);
  --edge:rgba(255,255,255,.16); --ink:#fff; --ink-2:rgba(255,255,255,.68); --ink-3:rgba(255,255,255,.44);
  --halo:0 0 0 2px rgba(255,255,255,.95),0 0 16px rgba(255,255,255,.22);
  --spring:cubic-bezier(.2,.9,.25,1.12); --ease:cubic-bezier(.25,.8,.25,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--ts))}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden}
/* touch-action:none opts in to Neural Band pinch-and-drag (pointer events); read once at load */
body{touch-action:none;display:grid;place-items:center;min-width:600px;min-height:600px}
/* every control eases its highlight in and out, and briefly presses in when pinched (.tap) */
.lrow,.btn,.tile,.spin,.slider,.seg button,.tab,#ccBtn,.winbar .close,.ccclose{transition:background-color .16s var(--ease),box-shadow .16s var(--ease),color .16s}
.lrow:focus,.spin:focus,.slider:focus,.tile:not(.on):focus,.btn:not(.primary):focus{background:rgba(255,255,255,.17)}
.tap{animation:tap .32s var(--spring)}
.icon.tap{animation:none}.icon.tap .disc{animation:tap .32s var(--spring)}
@keyframes tap{0%{transform:scale(.93)}100%{transform:scale(1)}}
/* moving between screens inside a window: the new screen fades up into place */
.window.swap>*{animation:swapIn .26s var(--ease) both}
@keyframes swapIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.16);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.reduce .tap,.reduce .tap .disc,.reduce .window.swap>*,.reduce .spinner{animation:none!important}
button,textarea,input{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
:focus{outline:none}
svg{display:block}
#stage{position:relative;width:600px;height:600px;overflow:hidden;background:#000;isolation:isolate}
/* rounded lens corners: a static black frame drawn on top (black is see-through on the lens). Cheaper than a rounded clip,
   which makes the GPU mask the video and every layer on each frame */
#stage::after{content:"";position:absolute;inset:0;border-radius:48px;box-shadow:0 0 0 60px #000;pointer-events:none;z-index:20}
#wall{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:calc(var(--wall) * (1 - var(--see,0)));transition:opacity .4s var(--ease);pointer-events:none}
/* no wallpaper behind the SiteVue AI intro: it fades in once the intro hands over to Home */
#stage.booting #wall,#stage.booting #wallimg{opacity:0}
/* your own photo as the wallpaper (it replaces the video; the Wallpaper and Transparency settings apply to it too) */
#wallimg{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
#wallimg.on{opacity:calc(var(--wall) * (1 - var(--see,0)))}
#wall.hidden{display:none}
.under~#wallimg.on{opacity:calc(var(--wall) * .45 * (1 - var(--see,0)))}
/* the iPhone send page */
.photosend #stage,.photosend #help{display:none!important}
body.photosend{display:block;min-width:0;min-height:0;overflow:auto;touch-action:auto}
#photosend{max-width:440px;margin:0 auto;padding:28px 20px 40px;display:flex;flex-direction:column;gap:14px;color:#eee;font-size:17px;line-height:1.4}
#photosend h1{font-size:26px;margin:0}
#photosend p{margin:0;color:#bbb}
#photosend input#ps-code{height:52px;border-radius:14px;background:#1c1e24;border:1px solid #3a3f47;padding:0 16px;font:600 22px ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#fff;text-transform:uppercase}
.ps-btn{display:flex;align-items:center;justify-content:center;height:54px;border-radius:27px;background:#2a2d36;color:#fff;font-weight:600;font-size:18px;cursor:pointer}
.ps-btn.primary{background:#4c52f9}
.ps-btn:disabled{opacity:.4}
#ps-preview{display:none;aspect-ratio:1;border-radius:22px;background:center/cover no-repeat}
#ps-preview.on{display:block}
#photosend .ps-note{font-size:14px;color:#888}
#wall.under{opacity:calc(var(--wall) * .45 * (1 - var(--see,0)))}
/* Transparency mode (--see 0/1) removes everything behind the apps (the wallpaper above and the logo outline), so only
   apps, buttons, icons and windows float over the real world; they stay fully visible */
#ui{position:absolute;inset:0;opacity:var(--bright);transition:opacity .2s}
.glass{background:linear-gradient(180deg,var(--glass-a),var(--glass-b));border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.g2{background:var(--glass-2);border-radius:22px}
.eyebrow{font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.title{font-size:1.75rem;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.sub{color:var(--ink-2);font-size:1.05rem}
.dim{color:var(--ink-3)}
button:focus,[tabindex="0"]:focus,textarea:focus,input:focus{box-shadow:var(--halo)}

/* ---------- Home View ---------- */
#home{position:absolute;inset:0;transition:opacity .35s var(--ease),scale .45s var(--spring)}
#home.behind{opacity:0;scale:.9;pointer-events:none}
#home.dimmed{opacity:.06}
#ccBtn{position:absolute;top:10px;left:50%;translate:-50% 0;width:64px;height:40px;border-radius:20px;
  display:grid;place-items:center;color:var(--ink-2);transition:width .25s var(--spring),color .2s}
#ccBtn svg{width:26px;height:26px}
#ccBtn:focus{width:84px;color:#fff}
.tabs{position:absolute;left:14px;top:50%;translate:0 -50%;display:flex;flex-direction:column;gap:10px;
  padding:8px;border-radius:40px;z-index:2}
.tab{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.tab svg{width:28px;height:28px}
.tab.sel{background:rgba(255,255,255,.22);color:#fff}
.tab .lbl{position:absolute;left:66px;top:50%;translate:0 -50%;white-space:nowrap;font-size:1.05rem;font-weight:600;
  padding:10px 16px;border-radius:22px;background:rgba(40,40,44,.96);border:1px solid var(--edge);
  opacity:0;scale:.85;transform-origin:left center;pointer-events:none;transition:opacity .18s,scale .25s var(--spring)}
.tab:focus .lbl{opacity:1;scale:1}
.icon{position:absolute;width:96px;display:flex;flex-direction:column;align-items:center;gap:14px;border-radius:50%}
.icon:focus{box-shadow:none}
.markbg{position:absolute;pointer-events:none;fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.12);stroke-width:2;opacity:calc(1 - var(--see,0));transition:opacity .4s var(--ease)}
.icon.hero{width:146px}
.icon.hero .disc{width:146px;height:146px}
.icon.hero .fg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.icon.hero .fg svg{width:60px;height:60px}
.icon.hero .fg b{font-size:1.08rem;font-weight:700;letter-spacing:.01em}
.icon.hero:focus .disc{scale:1.03}
.disc{position:relative;width:64px;height:64px;border-radius:50%;transition:scale .3s var(--spring),box-shadow .2s}
.disc .bg{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 34% 24%,var(--c1),var(--c2) 78%)}
.disc::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 32% 20%,rgba(255,255,255,.42),transparent 52%);pointer-events:none}
.disc .fg{position:absolute;inset:0;display:grid;place-items:center;transition:translate .3s var(--spring),scale .3s var(--spring)}
.disc .fg svg{width:32px;height:32px}
.disc .ini{font-size:22px;font-weight:700;letter-spacing:.02em}
.icon .nm{font-size:.95rem;font-weight:600;color:var(--ink-2);white-space:nowrap;line-height:1.15;text-align:center}
.icon .nm small{display:block;font-size:.8rem;font-weight:500;color:var(--ink-3)}
/* gaze highlight: the disc lifts, the glyph layer moves further than the backplate (parallax) */
.icon:focus .disc{scale:1.12;box-shadow:0 0 0 3px rgba(255,255,255,.92),0 0 14px var(--c1)}
.icon:focus .fg{scale:1.08;translate:0 -3px}
/* Home buttons are see-through glass tinted with their color (a thin bright rim keeps the circle crisp); the icon art,
   and Clock In's name, stay solid white on top */
#home .icon .disc .bg{opacity:.18}
/* light on the glass: a soft glare across the top, a bright spark at the upper left, and a faint rim light at the bottom */
#home .icon .disc::after{opacity:1;background:
  radial-gradient(circle at 30% 18%,rgba(255,255,255,.75),rgba(255,255,255,0) 22%),
  radial-gradient(ellipse 85% 55% at 50% 0%,rgba(255,255,255,.42),rgba(255,255,255,0) 70%),
  radial-gradient(ellipse 70% 30% at 50% 100%,rgba(255,255,255,.22),rgba(255,255,255,0) 75%)}
#home .icon .disc{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.38)}
#home .icon:focus .disc{box-shadow:0 0 0 3px rgba(255,255,255,.92),0 0 14px var(--c1)}
#home .icon:focus .disc .bg{opacity:.32}
#home .icon .fg{color:#fff}
.icon:focus .nm{color:#fff}
.empty{position:absolute;left:110px;right:24px;top:300px;text-align:center}
.status{position:absolute;bottom:16px;left:50%;translate:-50% 0;display:flex;align-items:center;gap:14px;
  padding:9px 20px;border-radius:24px;font-size:1rem;font-weight:600;white-space:nowrap}
.status .sep{width:4px;height:4px;border-radius:50%;background:var(--ink-3)}
.status .live{color:var(--accent)}
.bat{display:inline-flex;align-items:center;gap:6px}
.bat svg{width:26px;height:26px}

/* ---------- Sliders (Digital Crown analogue) ---------- */
.slider{display:flex;align-items:center;gap:14px;width:100%;height:64px;padding:0 20px;border-radius:32px;
  background:var(--glass-2);text-align:left}
.slider svg{width:26px;height:26px;flex:0 0 auto}
.slider .sl-l{font-weight:600;font-size:1.05rem;width:108px;flex:0 0 auto}
.slider .track{flex:1;height:12px;border-radius:6px;background:rgba(255,255,255,.16);overflow:hidden}
.slider .track i{display:block;height:100%;background:#fff;border-radius:6px}
.slider .sl-v{width:52px;text-align:right;font-weight:600;color:var(--ink-2)}
.slider:focus .track i{background:var(--accent)}
/* inside a list (Settings), sliders match the other rows exactly and never get squeezed */
.list .slider{flex:0 0 auto;height:auto;min-height:62px;padding:10px 20px;border-radius:22px;background:var(--glass-b)}

/* ---------- Windows ---------- */
#win{position:absolute;inset:0;display:none;--wx:0px;--wy:0px}
#win.open{display:block}
.window{position:absolute;left:30px;top:22px;width:540px;height:480px;border-radius:38px;padding:22px 26px;
  display:flex;flex-direction:column;gap:12px;translate:var(--wx) var(--wy)}
.window.enter{animation:winIn .42s var(--spring)}
@keyframes winIn{from{scale:.2;opacity:0}to{scale:1;opacity:1}}
.winbar{position:absolute;top:514px;left:50%;display:flex;align-items:center;gap:12px;
  translate:calc(-50% + var(--wx)) var(--wy)}
.winbar .close{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.winbar .close svg{width:22px;height:22px}
.winbar .grab{width:170px;height:48px;border-radius:24px;display:grid;place-items:center}
.winbar .grab i{display:block;width:130px;height:10px;border-radius:5px;background:rgba(255,255,255,.42)}
.winbar .grab{cursor:grab}
.winbar .grab:active{cursor:grabbing}
.winbar .grab.moving i{background:var(--accent);box-shadow:0 0 18px var(--accent)}
.row2{display:flex;gap:10px}
.btn{min-height:58px;border-radius:29px;padding:0 24px;font-weight:600;font-size:1.1rem;background:var(--glass-2);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1}
.btn.primary{background:var(--accent);color:#000}
.btn.danger{color:#ff8a84}
.btn svg{width:22px;height:22px}
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:10px 20px;
  border-radius:22px;background:var(--glass-b);text-align:left;font-size:1.08rem;flex:0 0 auto}
.lrow b{font-weight:600}
.lrow .r{color:var(--ink-2);text-align:right;white-space:nowrap}
.lrow .sw{width:26px;height:26px;border-radius:50%}
.tog{width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.2);position:relative;flex:0 0 auto}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s var(--spring)}
.tog.on{background:#30d158}
.tog.on::after{left:23px}
.hms{display:flex;gap:8px}
.hms .spin{flex:1;min-height:56px;padding:0 12px;font-size:1.05rem;border-radius:28px}
.hms .spin b{font-size:1.3rem}
.hms .spin small{color:var(--ink-2);font-size:.85rem}
.spin{display:flex;align-items:center;justify-content:space-between;min-height:62px;padding:0 20px;border-radius:31px;
  background:var(--glass-2);font-size:1.2rem;font-weight:600;width:100%}
.spin .ar{color:var(--ink-3);font-size:1.1rem}
.spin:focus .ar{color:var(--accent)}
.dev{justify-content:flex-start;gap:14px}
.dev svg{width:30px;height:30px;flex:0 0 auto}
.dev .st{display:block;font-size:.9rem;color:var(--ink-2);font-weight:500;margin-top:2px}
.dev .r{margin-left:auto}
.dot2{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#ffd60a;vertical-align:1px}
.dot2.ok{background:#30d158}
.steps{margin:0;padding-left:1.4em;font-size:1.05rem;line-height:1.45}
.steps li{margin:6px 0}
.trk{display:flex;align-items:center;gap:10px;font-size:.85rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.trk .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.trk .bar i{display:block;height:100%;background:var(--accent)}
.sttl{font-size:1.45rem;font-weight:700;line-height:1.2}
.showctl{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:auto;flex:0 0 auto}
.showctl .btn{flex:0 0 220px}
.showarr{display:grid;place-items:center;width:40px;height:40px;color:var(--ink-2)}
.showarr svg{width:30px;height:30px;rotate:90deg}
.showarr.r svg{rotate:-90deg}
.vfreeze{position:absolute;z-index:5;border-radius:18px;object-fit:cover;pointer-events:none;transition:opacity .4s var(--ease)}
.vfreeze.out{opacity:0}
.reduce .vfreeze{transition:none}
.showvid{display:block;width:100%;height:250px;object-fit:cover;border-radius:18px;flex:0 0 auto;background:#fff}
.stimg{display:block;width:100%;height:104px;object-fit:cover;border-radius:18px;flex:0 0 auto;background:#fff}
.sdet{font-size:1rem;line-height:1.4;color:var(--ink-2)}
.call{border-radius:18px;padding:10px 14px;font-size:.92rem;line-height:1.35;background:rgba(255,214,10,.12);border:1px solid rgba(255,214,10,.45)}
.call b{display:block;font-size:.78rem;letter-spacing:.08em;color:#ffd60a}
.call.caution{background:rgba(255,99,90,.12);border-color:rgba(255,120,110,.5)}
.call.caution b{color:#ff8a84}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.12)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.45);flex:0 0 auto;display:grid;place-items:center}
.chk.on{background:#30d158;border-color:#30d158}
.chk svg{width:16px;height:16px;stroke-width:3}
.grp{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:8px 6px 0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;flex:1}

/* app specifics */
.bigtime{font-size:4.8rem;font-weight:600;letter-spacing:-.03em;line-height:1}
.wc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.wcard{padding:12px 18px;border-radius:22px;background:var(--glass-b)}
.wcard b{display:block;font-size:1.7rem;font-weight:600}
.wcard small{color:var(--ink-3);font-size:.9rem}
.ring{position:relative;width:150px;height:150px;margin:0 auto;flex:0 0 auto}
.ring svg{width:150px;height:150px;rotate:-90deg}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;font-size:2.3rem;font-weight:600;letter-spacing:-.02em}
.ring .rt small{display:block;font-size:.95rem;font-weight:500;color:var(--ink-2);text-align:center;letter-spacing:0}
.presets{display:flex;gap:8px}
.presets .btn{min-height:52px;padding:0 10px;font-size:1rem}
.presets .btn.on{background:#fff;color:#000}
.seg{display:flex;gap:6px;padding:5px;border-radius:30px;background:var(--glass-b);align-self:center;flex:0 0 auto}
.seg button{height:48px;padding:0 18px;border-radius:24px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:1.02rem;color:var(--ink-2)}
.seg button svg{width:20px;height:20px}
.seg button.sel{background:rgba(255,255,255,.22);color:#fff}
.wx-now{display:flex;align-items:center;gap:20px}
.wx-now .t{font-size:5rem;font-weight:600;letter-spacing:-.03em;line-height:1}
.wx-days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wx-days div{background:var(--glass-b);border-radius:18px;padding:10px 4px;text-align:center;font-size:.95rem}
.wx-days b{display:block;font-size:1.15rem}
.swtime{font-size:4.6rem;font-weight:600;letter-spacing:-.03em;text-align:center;line-height:1.1}
.calc-d{text-align:right;font-weight:500;line-height:1;padding:6px 8px 4px;min-height:70px;white-space:nowrap;overflow:hidden}
.calc-d small{display:block;font-size:1rem;color:var(--ink-3);min-height:20px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;flex:1}
.keys button{border-radius:24px;background:var(--glass-2);font-size:1.5rem;font-weight:600}
.keys .op{background:rgba(255,159,10,.85);color:#000}
.keys .op.on{background:#fff}
.keys .fn{background:rgba(255,255,255,.3)}
textarea{width:100%;flex:1;min-height:0;resize:none;border-radius:24px;background:var(--glass-b);padding:16px 18px;
  font-size:1.25rem;line-height:1.35;cursor:text}
input[type=text]{width:100%;height:62px;border-radius:31px;background:var(--glass-2);padding:0 22px;font-size:1.2rem;cursor:text}
textarea::placeholder,input::placeholder{color:var(--ink-3)}
.avatar-lg .disc{width:120px;height:120px}
.avatar-lg .disc .ini{font-size:42px}

/* ---------- Control Center ---------- */
#cc{position:absolute;inset:0;display:none}
#cc.open{display:block}
.ccpanel{position:absolute;left:56px;top:18px;width:488px;border-radius:38px;padding:20px;display:flex;flex-direction:column;gap:12px}
.ccpanel.enter{animation:ccIn .38s var(--spring)}
@keyframes ccIn{from{translate:0 -40px;opacity:0}to{translate:0 0;opacity:1}}
.cchead{display:flex;justify-content:space-between;align-items:flex-start;padding:0 6px}
.cctime{font-size:2.6rem;font-weight:600;letter-spacing:-.02em;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tiles .tile{grid-column:span 2}
.tiles .tile:nth-child(n+4){grid-column:span 3}
.tile{height:92px;border-radius:26px;background:var(--glass-2);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:7px;font-size:.88rem;font-weight:600;text-align:center;line-height:1.1}
.tile svg{width:28px;height:28px}
.tile.on{background:rgba(255,255,255,.88);color:#000}
.ccclose{align-self:center;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto}
.ccclose svg{width:24px;height:24px}
.ccclose:focus{color:#fff}

/* ---------- boot intro ---------- */
#boot{position:absolute;inset:0;z-index:8;perspective:700px;overflow:hidden;transition:opacity .5s var(--ease),scale .6s var(--ease)}
#boot.out{opacity:0;scale:1.06;pointer-events:none}
#boot .glow{position:absolute;left:50%;top:50%;width:540px;height:230px;translate:-50% -50%;border-radius:50%;opacity:0;transition:opacity .6s;
  background:radial-gradient(closest-side,rgba(76,82,249,.55),rgba(42,7,246,.18) 60%,transparent)}
@property --dz{syntax:'<length>';inherits:true;initial-value:0px}
#boot .logo,#boot .pcs{position:absolute;left:60px;top:266px;width:480px;height:68px;transform-style:preserve-3d}
/* each piece keeps its own 3D extrusion, but pieces never intersect: .pcs flattens them and paints back-to-front (see runIntro),
   with its own perspective so depth still reads */
#boot .pcs{left:0;top:0;transform-style:flat;perspective:700px}
#boot .pc{position:absolute;transform-style:preserve-3d;will-change:transform;--dz:1.8px} /* fixed thickness: only transform animates, so it stays on the GPU */
#boot .ly{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#boot canvas.ly{inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);backface-visibility:hidden}
#boot .whole{position:absolute;inset:0;width:100%;height:100%;overflow:visible;opacity:0;transition:opacity .45s var(--ease)}
#boot .pcs{transition:opacity .45s var(--ease),visibility 0s .45s} /* crossfades into the flat logo, then stops drawing */
#boot.lit .glow,#boot.lit .whole{opacity:1}
/* once still, the logo grows slightly for exactly as long as the light takes to cross it */
#boot .logo,#boot .glow{transition:scale var(--sweep,1.5s) cubic-bezier(.3,.2,.5,1),opacity .6s}
#boot.lit .logo,#boot.lit .glow{scale:1.08}
#boot.lit .pcs{opacity:0;visibility:hidden}
#boot .wh{opacity:0;transition:opacity .22s}
#boot .wh.on{opacity:1}
#home.boot{opacity:0}

/* ---------- mirroring ---------- */
.mirr{color:#ff6b6b;font-weight:700}
.phthumb{width:56px;height:56px;border-radius:14px;background:center/cover;flex:0 0 auto}
.mcode{font:700 2.6rem/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;padding:8px 18px;border-radius:18px;background:rgba(255,255,255,.1)}
.watching #help{display:none!important}
.watching #stage{scale:var(--vz,1)}
.watching{padding-top:44px}
#watchbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 18px;font-size:14px;
  background:#111317;color:#ddd;border-bottom:1px solid #2a2d33;flex-wrap:wrap}
#watchbar .wdot{width:9px;height:9px;border-radius:50%;background:#777}
#watchbar.live .wdot{background:#ff4d4d;box-shadow:0 0 8px #ff4d4d}
#watchbar .ws{color:#9aa}
#watchbar form{display:flex;gap:8px}
#watchbar input{background:#1d2026;border:1px solid #3a3f47;border-radius:8px;height:32px;padding:0 10px;font:600 14px ui-monospace,Menlo,monospace;color:#fff;letter-spacing:.06em;width:130px;cursor:text}
#watchbar button{background:#4c52f9;color:#fff;border-radius:8px;height:32px;padding:0 14px;font-weight:600}
#watchwait{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.72);color:#ccd;font-size:1.05rem}

/* ---------- the glasses: light rendering ----------
   Moving the highlight must be instant on the lens, so on the glasses (body.lens) nothing animates or blurs when focus
   moves: no transitions, no blurred glow rings, a simple ring instead, one flat reflection on the glass buttons, and no
   rounded-corner overlay (black is see-through on the lens anyway). Looks nearly the same; costs far less to draw. */
.lens *,.lens *::after,.lens *::before{transition:none!important}
.lens{--halo:0 0 0 3px #fff}
.lens #stage::after{display:none}
.lens .icon:focus .disc{box-shadow:0 0 0 3px #fff!important;scale:1.08}
.lens .icon:focus .fg{scale:1;translate:none}
.lens #home .icon .disc::after{background:radial-gradient(circle at 32% 22%,rgba(255,255,255,.55),rgba(255,255,255,0) 45%)}
.lens .tap,.lens .icon.tap .disc,.lens .window.swap>*{animation:none!important}
.lens .winbar .grab.moving i{box-shadow:none}
.lens .spin:focus .ar,.lens .slider:focus .track i{transition:none}

/* ---------- toast ---------- */
#toast{position:absolute;top:14px;left:50%;translate:-50% -80px;padding:12px 22px;border-radius:26px;font-size:1.05rem;
  font-weight:600;white-space:nowrap;z-index:9;transition:translate .35s var(--spring),opacity .25s;opacity:0;pointer-events:none;
  background:rgba(44,44,48,.97);border:1px solid var(--edge)}
#toast.show{translate:-50% 0;opacity:1}

.reduce *{transition:none!important}
.reduce .window,.reduce .ccpanel{animation:none!important}

/* desktop testing only: frame the 600x600 lens */
@media (min-width:700px) and (min-height:700px){
  #stage{outline:1px solid #2a2a2e}
  #help{display:block}
}
#help{display:none;position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#666;font-size:13px}

/* ---------- Bluetooth Devices ----------
   Display Web Apps get no Bluetooth access: the glasses pair with the phone, and the Neural Band with
   the glasses, in the Meta AI app. So this screen reports what the app can observe and shows the real
   pairing steps instead of pretending to pair. */
const BAND = { last:0 };                     // last swipe/pinch input (Neural Band or the glasses' touchpad)
const onGlasses = () => innerWidth <= 600 && innerHeight <= 600 && !matchMedia('(hover: hover)').matches;
function ago(t){ const s = Math.round((now() - t) / 1000); return s < 3 ? 'just now' : s < 60 ? s + ' s ago' : Math.round(s / 60) + ' min ago'; }
function glassesState(){ return onGlasses() ? [true, 'Connected · running this app'] : [false, 'Not detected · open in a browser']; }
function bandState(){ return BAND.last ? [true, 'Active · input ' + ago(BAND.last)] : [false, 'Waiting · swipe or pinch to check']; }
const stHTML = ([ok, txt]) => `<i class="dot2 ${ok ? 'ok' : ''}"></i>${txt}`;
function btSummary(){ const n = glassesState()[0] + bandState()[0]; return n === 2 ? 'Both connected' : n + ' of 2 connected'; }
function btHTML(){
  const row = (k, icon, name, st) => `<button class="lrow dev" data-k="bt-${k}" data-act="btOpen" data-v="pair-${k}" ${k === 'glasses' ? 'data-default' : ''}>${svg(icon)}<span><b>${name}</b><span class="st" data-live="st-${k}">${stHTML(st)}</span></span><span class="r">Pair ›</span></button>`;
  return `<div class="eyebrow">Settings</div><div class="title">Bluetooth Devices</div>
    <div class="list">${row('glasses', 'glasses', 'Meta Ray-Ban Display', glassesState())}${row('band', 'band', 'Meta Neural Band', bandState())}</div>
    <div class="sub" style="font-size:.92rem">Pairing happens in the Meta AI app on your phone. Web apps can't use Bluetooth directly, so this screen shows each device's status and how to pair it.</div>`;
}
function pairHTML(arg){
  const band = arg === 'pair-band';
  const steps = band
    ? ['Put on the Meta Neural Band and make sure it is charged.', 'On your phone, open the Meta AI app and go to your glasses’ settings.', 'Choose <b>Meta Neural Band</b> and follow the steps to pair it with your glasses.', 'Come back here and swipe or pinch. The status below turns green.']
    : ['Turn on Bluetooth on your phone and open the Meta AI app.', 'Go to <b>Devices</b>, add your Meta Ray-Ban Display, and follow the steps.', 'To open this app on them, go to <b>Apps → Web Apps → Connect Web App</b> and paste its link.'];
  return `<div class="eyebrow">Bluetooth Devices</div><div class="title">Pair ${band ? 'Meta Neural Band' : 'Meta Ray-Ban Display'}</div>
    <ol class="steps">${steps.map(t => `<li>${t}</li>`).join('')}</ol>
    <div class="lrow dev" tabindex="0" data-k="pair-status">${svg(band ? 'band' : 'glasses')}<span><b>Status</b><span class="st" data-live="st-${band ? 'band' : 'glasses'}">${stHTML(band ? bandState() : glassesState())}</span></span></div>
    <button class="btn primary" data-k="pair-done" data-act="close" data-default style="flex:0 0 auto;margin-top:auto">Done</button>`;
}

/* ---------- live updates (4 Hz; the display runs at 30 Hz) ---------- */
function tick(){
  const d = new Date();
  if(P.timer.end && now() >= P.timer.end){
    const late = now() - P.timer.end, at = new Date(P.timer.end); P.timer.end = null; P.timer.left = null; save();
    // finished while the app was closed or asleep: a quiet note instead of a sudden ring
    if(late > 60000) toast('Timer finished at ' + fmtTime(at), 4000); else ringStart(); if(V.app === 'clock' && V.arg === 'timer') render(); }
  set('status', statusHTML(), true);
  set('ccTime', fmtTime(d)); set('ccDate', fmtDate(d)); set('clockBig', fmtTime(d)); set('clockDate', fmtDate(d));
  document.querySelectorAll('[data-live-tz]').forEach(e => { const t = fmtTime(d, e.dataset.liveTz); if(e.textContent !== t) e.textContent = t; });
  if(V.app === 'clock' && V.arg === 'timer'){
    const left = timerLeft(), C2 = 2 * Math.PI * 96;
    set('timerLeft', fmtDur(left));
    const arc = q('timerArc'); if(arc) arc.setAttribute('stroke-dashoffset', (C2 * (1 - clamp(left / P.timer.dur, 0, 1))).toFixed(1));
  }
  if(V.app === 'clock' && V.arg === 'stopwatch') set('sw', fmtDur(swElapsed(), true));

  for(const k of ['click', 'done']) fetch(k + '.wav').then(r => r.arrayBuffer()).then(b => AC.decodeAudioData(b)).then(buf => SND[k] = buf).catch(() => {}); } catch(e){}
const GAIN = { click:.5, done:.85 }, LAST_SND = {};
function playSound(k){
  if(!P.clicks || !AC || !SND[k]) return;
  const t = performance.now(); if(t - (LAST_SND[k] || 0) < 45) return; LAST_SND[k] = t;
  try { if(AC.state === 'suspended') AC.resume();
    const src = AC.createBufferSource(), g = AC.createGain(); src.buffer = SND[k]; g.gain.value = GAIN[k] || .6;
    src.connect(g).connect(AC.destination); src.start(); } catch(e){}
}

function calc(k){
  const num = s => parseFloat(s), fmt = r => !isFinite(r) ? 'Error' : String(parseFloat(r.toPrecision(12)));
  const run = (a, op, b) => op === '+' ? a + b : op === '−' ? a - b : op === '×' ? a * b : b === 0 ? NaN : a / b;
  if(K.cur === 'Error' && k !== 'C') { K.cur = '0'; K.fresh = true; }
  if(/[0-9]/.test(k)){ if(K.fresh){ K.cur = k; K.fresh = false; } else if(K.cur.replace(/[-.]/g, '').length < 12) K.cur = K.cur === '0' ? k : K.cur + k; }
  else if(k === '.'){ if(K.fresh){ K.cur = '0.'; K.fresh = false; } else if(!K.cur.includes('.')) K.cur += '.'; }
  else if(k === 'C'){ Object.assign(K, { cur:'0', acc:null, op:null, fresh:true, expr:'' }); }
  else if(k === '±'){ K.cur = K.cur.startsWith('-') ? K.cur.slice(1) : K.cur === '0' ? '0' : '-' + K.cur; }
  else if(k === '%'){ K.cur = fmt(num(K.cur) / 100); }
  else if(k === '⌫'){ if(!K.fresh){ K.cur = K.cur.length > 1 && K.cur !== '-0' ? K.cur.slice(0, -1) : '0'; if(K.cur === '-') K.cur = '0'; } }
  else if(k === '='){ if(K.op){ K.expr = `${fmt(K.acc)} ${K.op} ${K.cur} =`; K.cur = fmt(run(K.acc, K.op, num(K.cur))); K.acc = null; K.op = null; K.fresh = true; } }
  else { // operator
    if(K.op && !K.fresh){ K.acc = run(K.acc, K.op, num(K.cur)); K.cur = fmt(K.acc); } else K.acc = num(K.cur);
    K.op = k; K.fresh = true; K.expr = `${fmt(K.acc)} ${k}`;
  }
}
function getWeather(){
  // inside the Mac app the web view has no location access of its own: ask the app, which uses macOS location services
  const nat = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.svLocation;
  if(nat){
    W.loading = true; W.place = ''; W.err = ''; render();
    const to = setTimeout(() => window.svNativeLocation(null, null, 'timeout'), 15000);
    window.svNativeLocation = (lat, lon, err) => {
      clearTimeout(to); window.svNativeLocation = null;
      if(lat != null) return fetchWx(lat, lon);
      W.loading = false;
      W.err = err === 'denied' ? 'Location is off for SiteVue.AR Home. Turn it on in System Settings → Privacy & Security → Location Services, or pick a city.'
        : err === 'timeout' ? 'Timed out finding your location. Try again or pick a city.' : 'Location is unavailable right now. Try again or pick a city.';
      if(V.app === 'weather') render(true);
    };
    nat.postMessage('get');
    return;
  }
  if(!navigator.geolocation){ W.err = 'Location is not available.'; return render(true); }
  W.loading = true; W.place = ''; W.err = ''; render();
  navigator.geolocation.getCurrentPosition(p => fetchWx(p.coords.latitude, p.coords.longitude), err => {
    W.loading = false; W.err = err.code === 1 ? 'Location permission was declined. Allow it from the system menu → Permissions.' : err.code === 3 ? 'Timed out finding your location. Try again.' : 'Location is unavailable right now.';
    if(V.app === 'weather') render(true);
  }, { timeout:15000, maximumAge:600000 });
}
async function fetchWx(lat, lon, place){ // place: a picked city's name (none = from your location)
  W.loading = true; W.place = place || ''; if(V.app === 'weather') render(true);
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5&wind_speed_unit=mph&temperature_unit=${P.units === 'F' ? 'fahrenheit' : 'celsius'}`;
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 12000);
    const r = await fetch(u, { signal:ac.signal }).finally(() => clearTimeout(to)); if(!r.ok) throw new Error('HTTP ' + r.status);
    P.wx = { lat, lon, place:place || '', at:now(), data:await r.json() }; W.err = ''; save();
  } catch(err){ W.err = err.name === 'AbortError' ? 'The forecast took too long. Check the connection and try again.' : 'Could not reach the forecast (' + err.message + ').'; }

}

/* ---------- timer ringtone ----------
   An original chime made with Web Audio (no recording): a bright rising three-note phrase, repeated like a phone's
   timer alarm until you pinch or swipe, or for one minute. */
const RING = { on:false, t:0, until:0 };
function chime(at, f){
  const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(), g2 = AC.createGain();
  o.type = 'sine'; o.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * 2; g2.gain.value = .18; // a soft overtone for a bell-like ring
  g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.32, at + .006); g.gain.exponentialRampToValueAtTime(.0008, at + .55);
  o.connect(g); o2.connect(g2).connect(g); g.connect(AC.destination);
  o.start(at); o2.start(at); o.stop(at + .6); o2.stop(at + .6);
}
function ringPhrase(){
  if(!RING.on || !AC) return;
  if(now() > RING.until) return ringStop();
  try { if(AC.state === 'suspended') AC.resume(); const t = AC.currentTime + .02;
    [[0, 880], [.13, 1108.7], [.26, 1318.5], [.52, 1108.7], [.65, 1318.5]].forEach(([d, f]) => chime(t + d, f)); } catch(e){}
  RING.t = setTimeout(ringPhrase, 1500);
}
function ringStart(){
  if(WATCH !== null) return; // the glasses ring; a computer that's only watching stays quiet (it can't be silenced)
  ringStop(); RING.on = true; RING.until = now() + 60000;
  toast('Timer done · pinch to stop', 60000);
  ringPhrase();
}
function ringStop(){
  if(!RING.on) return false;
  RING.on = false; clearTimeout(RING.t); $('#toast').classList.remove('show');
  return true;
}
// any swipe or pinch silences a ringing timer; the pinch that stops it does nothing else
addEventListener('keydown', e => { if(ringStop()){ e.stopImmediatePropagation(); e.preventDefault(); } }, true);

/* ---------- Clock In: a shift time clock ----------
   Punches are kept on this device only (no payroll system behind it). Worked time excludes breaks. */
const PU = () => P.punch || (P.punch = { in:0, brk:0, brkAcc:0, log:[] });
const brkMs = () => { const u = PU(); return u.brkAcc + (u.brk ? now() - u.brk : 0); };
const workedNow = () => { const u = PU(); return u.in ? now() - u.in - brkMs() : 0; };
const dayStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return +d; };
const weekStart = () => { const d = new Date(dayStart()); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return +d; }; // Monday
const workedSince = t => PU().log.filter(e => e.in >= t).reduce((a, e) => a + e.out - e.in - e.brk, 0) + (PU().in >= t ? workedNow() : 0);
const hrs = ms => { const m = Math.max(0, Math.round(ms / 60000)); return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm'; };
function punchState(){
  const u = PU();
  if(!u.in) return 'Off the clock';
  return u.brk ? 'On break since ' + fmtTime(new Date(u.brk)) : 'On the clock since ' + fmtTime(new Date(u.in));
}

/* ---------- boot intro: the SiteVue AI logo pieces float in 3D, then assemble ---------- */
function runIntro(){
  if(PHOTOSEND !== null) return;
  if(WATCH !== null){ $('#boot').remove(); $('#stage').classList.remove('booting'); return; }
  const boot = $('#boot'), K = 480 / 3526, pcs = boot.querySelector('.pcs'), all = LOGO.map(p => p[4]).join('');
  // while flying, each piece is extruded: a bright face plus DEPTH darker layers stepping back along z
  // 18 thin slices 1.2 px apart (same 21.6 px depth as before) with a smooth color ramp, so the sides read as one solid
  // object instead of visible steps
  const DEPTH = 12, side = j => { const t = (j - 1) / (DEPTH - 1), m = (a, b) => Math.round(a + (b - a) * t); return `rgb(${m(92, 23)},${m(99, 18)},${m(255, 122)})`; };
  boot.querySelector('defs').insertAdjacentHTML('beforeend', LOGO.map((p, i) => `<path id="lp${i}" d="${p[4]}" fill-rule="evenodd"/>`).join(''));
  // every layer is drawn once into a bitmap (sharp at the 2x size the pieces fly in at), so while they move the device
  // only slides finished pictures around instead of redrawing ~170 vector shapes each frame
  const RES = 2 * Math.max(1, Math.min(2, devicePixelRatio || 1));
  pcs.innerHTML = LOGO.map(([x, y, w, hh], i) => {
    let ly = '';
    for(let j = DEPTH; j >= 1; j--) ly += `<canvas class="ly dp" data-p="${i}" data-j="${j}" style="transform:translateZ(calc(var(--dz) * -${j}))"></canvas>`;
    ly += `<canvas class="ly" data-p="${i}" data-j="0"></canvas>`;
    return `<div class="pc" style="left:${x * K}px;top:${y * K}px;width:${w * K}px;height:${hh * K}px">${ly}</div>`;
  }).join('');
  pcs.querySelectorAll('canvas').forEach(cv => {
    const i = +cv.dataset.p, j = +cv.dataset.j, [x, y, w, hh, d] = LOGO[i], f = K * RES;
    cv.width = Math.ceil(w * f) + 4; cv.height = Math.ceil(hh * f) + 4;
    const g = cv.getContext('2d'), path = new Path2D(d);
    g.translate(2, 2); g.scale(f, f); g.translate(-x, -y);
    if(j){ g.fillStyle = side(j); g.fill(path, 'evenodd'); }
    else {
      const gr = g.createLinearGradient(0, y, 0, y + hh);
      gr.addColorStop(0, '#f9f9fc'); gr.addColorStop(.45, '#8fa4ff'); gr.addColorStop(1, '#4c52f9');
      g.fillStyle = gr; g.fill(path, 'evenodd');
      g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 5; g.stroke(path);
    }
  });
  // finished logo: gradient letters, a white copy of each piece (lit as the light passes it), then the moving light on top
  boot.querySelector('.whole').innerHTML = `<path d="${all}" fill="url(#bootFill)" fill-rule="evenodd"/>`
    + LOGO.map((p, i) => `<use class="wh" href="#lp${i}" fill="#fff"/>`).join('')
    + `<path d="${all}" fill="url(#bootShine)" fill-rule="evenodd"/>`;
  homeEl.classList.add('boot');
  let done = false; const timers = [];
  const finish = () => {
    if(done) return; done = true;
    timers.forEach(clearTimeout); removeEventListener('keydown', skip, true); boot.removeEventListener('click', skip);
    boot.classList.add('out'); homeEl.classList.remove('boot'); $('#stage').classList.remove('booting'); wallPlay();
    if(!P.reduce) homeEl.querySelectorAll('.icon').forEach((e, i) => e.animate([{ opacity:0, scale:.6 }, { opacity:1, scale:1 }],
      { duration:480, delay:120 + i * 45, easing:'cubic-bezier(.2,.9,.25,1.12)', fill:'backwards' }));
    setTimeout(() => boot.remove(), 700);
  };
  const skip = e => { e.preventDefault(); e.stopImmediatePropagation(); finish(); }; // a pinch skips; it must not also open an app
  addEventListener('keydown', skip, true); boot.addEventListener('click', skip);
  const whites = [...boot.querySelectorAll('.wh')];
  if(P.reduce){ boot.classList.add('lit'); timers.push(setTimeout(() => whites.forEach(w => w.classList.add('on')), 300), setTimeout(finish, 1500)); return; }
  const INTRO_MS = 2950; // drift in 1.1 s, float 0.75 s, snap together 1.1 s
  const rand = a => (Math.random() * 2 - 1) * a;
  const T = (x, y, z, a, b, c, k = 1) => `translate3d(${x}px,${y}px,${z}px) rotateX(${a}deg) rotateY(${b}deg) rotateZ(${c}deg) scale3d(${k},${k},${k})`;
  // pick every piece's flight first, then paint them farthest-first; the depth order holds for the whole flight
  // (every keyframe keeps the same z ranking), so pieces pass in front of / behind each other instead of clipping
  const flights = [...pcs.children].map((el, i) => ({ el, i, x:rand(300), y:rand(250), z:-220 + Math.random() * 300, a:rand(70), b:rand(80), c:rand(120) }));
  flights.slice().sort((p, q) => p.z - q.z).forEach(f => pcs.appendChild(f.el));
  flights.forEach(({ el, i, x, y, z, a, b, c }) => {
    el.animate([
      // one continuous motion: every segment starts and ends at the speed of its neighbour (no sudden changes of pace)
      { transform:T(x * 1.3, y * 1.3, z - 1600, a - 40, b - 40, c - 60, 2), easing:'cubic-bezier(.22,.61,.36,1)' }, // glide in from deep space, easing off
      { transform:T(x, y, z, a, b, c, 2), offset:.42, easing:'cubic-bezier(.45,.05,.55,.95)' },                    // drift, gently turning
      { transform:T(x * .55, y * .55, z * .5, a * .5, b * .5, c * .5, 1.5), offset:.7, easing:'cubic-bezier(.33,0,.15,1)' }, // home in
      { transform:T(0, 0, 0, 0, 0, 0) }                                                                     // settle face-on (the flat logo then replaces the pieces)
    ], { duration:INTRO_MS, delay:i * 38, fill:'both' });
    // the extruded sides fade away over the last stretch, so each piece arrives flat (opacity stays on the GPU)
    el.querySelectorAll('.dp').forEach(d => d.animate([{ opacity:1 }, { opacity:1, offset:.8 }, { opacity:0 }],
      { duration:INTRO_MS, delay:i * 38, fill:'both', easing:'ease-in-out' }));
  });
  const assembled = INTRO_MS + LOGO.length * 38 + 60, SWEEP_MS = 1900; // light crossing the logo (it grows meanwhile)
  const HOLD_MS = 3000; // the finished white logo stays on screen this long (a pinch still skips)
  boot.style.setProperty('--sweep', SWEEP_MS + 'ms'); $('#bootSweep').setAttribute('dur', SWEEP_MS / 1000 + 's');
  timers.push(setTimeout(() => { boot.classList.add('lit'); try { $('#bootSweep').beginElement(); } catch(e){} }, assembled));
  // the light's center moves linearly from x=-450 to x=4050 (logo units) over SWEEP_MS; a piece turns
  // white once the light has left it and reached the next letter (its right edge + a small gap)
  LOGO.forEach(([x, , w], i) => timers.push(setTimeout(() => whites[i].classList.add('on'),
    assembled + (x + w + 40 + 450) / 4500 * SWEEP_MS)));
  timers.push(setTimeout(finish, assembled + SWEEP_MS + HOLD_MS)); // linger on the white logo, then go to Home
}

/* ---------- Mirror to a computer ----------
   The glasses can't capture their screen, so they send what is on it instead: which screen is open, what is
   highlighted, and the app data it shows (timers, tasks, notes...). A computer opens the same app with ?watch=CODE
   and replays that state live, so it looks and moves exactly like the lens (clocks and timers tick on their own).
   Everything is encrypted (AES-GCM) with a key made from the one-time code, before it leaves the glasses, and sent
   through a free public MQTT relay that only ever sees scrambled bytes. The code never leaves the two devices. */
const MIRROR_RELAY = 'wss://broker.hivemq.com:8884/mqtt';
const MIRROR = { client:null, key:null, topic:'', state:'off', seenAt:0, pushT:0, beat:0 };

// a tiny MQTT 3.1.1 client over WebSocket (connect, publish, subscribe, ping), so the lens loads no extra library
function mqttClient(url, onMsg, onState){
  let ws = null, buf = new Uint8Array(0), ping = 0, open = false, closed = false, retry = 1000;
  const subs = [], enc = new TextEncoder();
  const cat = (...parts) => { let n = 0; for(const p of parts) n += p.length; const o = new Uint8Array(n); let i = 0; for(const p of parts){ o.set(p, i); i += p.length; } return o; };
  const str = s => { const b = enc.encode(s); return cat(new Uint8Array([b.length >> 8, b.length & 255]), b); };
  const vlen = n => { const o = []; do { let d = n % 128; n = Math.floor(n / 128); if(n > 0) d |= 128; o.push(d); } while(n > 0); return new Uint8Array(o); };
  const pkt = (h, body) => cat(new Uint8Array([h]), vlen(body.length), body);
  const send = p => { try { if(ws && ws.readyState === 1) ws.send(p); } catch(e){} };
  const sendSub = t => send(pkt(0x82, cat(new Uint8Array([0, 1]), str(t), new Uint8Array([0]))));
  function connect(){
    if(closed) return;
    onState('connecting');
    try { ws = new WebSocket(url, 'mqtt'); } catch(e){ return later(); }
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => send(pkt(0x10, cat(str('MQTT'), new Uint8Array([4, 2, 0, 60]), str('sv' + Math.random().toString(36).slice(2, 12)))));
    ws.onmessage = e => { buf = cat(buf, new Uint8Array(e.data)); parse(); };
    ws.onclose = () => { open = false; clearInterval(ping); onState('offline'); later(); };
    ws.onerror = () => { try { ws.close(); } catch(e){} };
  }
  function later(){ if(!closed){ setTimeout(connect, retry); retry = Math.min(retry * 2, 15000); } }
  function parse(){
    for(;;){
      if(buf.length < 2) return;
      let mult = 1, len = 0, i = 1, b;
      do { if(i >= buf.length) return; b = buf[i++]; len += (b & 127) * mult; mult *= 128; } while(b & 128);
      if(buf.length < i + len) return;
      const type = buf[0] >> 4, qos = (buf[0] >> 1) & 3, body = buf.subarray(i, i + len);
      buf = buf.slice(i + len);
      if(type === 2){ open = true; retry = 1000; subs.forEach(sendSub); clearInterval(ping); ping = setInterval(() => send(new Uint8Array([0xC0, 0])), 30000); onState('on'); }
      else if(type === 3){ const tl = (body[0] << 8) | body[1], topic = new TextDecoder().decode(body.subarray(2, 2 + tl)); onMsg(topic, body.slice(2 + tl + (qos ? 2 : 0))); }
    }
  }
  connect();
  return {
    publish(t, payload, retain){ if(open) send(pkt(0x30 | (retain ? 1 : 0), cat(str(t), payload))); },
    subscribe(t){ subs.push(t); if(open) sendSub(t); },
    end(){ closed = true; clearInterval(ping); try { ws && ws.close(); } catch(e){} },
    get open(){ return open; },
  };
}

// the code (8 letters/digits, ~40 bits) makes both the AES key and the relay topic; the relay never sees the code
const MIRROR_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O or 1/I
const mirrorCode = () => { const r = crypto.getRandomValues(new Uint8Array(8)); return [...r].map(b => MIRROR_ABC[b % MIRROR_ABC.length]).join(''); };
const fmtCode = c => c.slice(0, 4) + '-' + c.slice(4);
async function mirrorKeys(code){
  const enc = new TextEncoder(), base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:enc.encode('sitevue-ar-mirror-v1'), iterations:60000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt', 'decrypt']);
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('topic:' + code)));
  return { key, topic:'sitevue-ar/m/' + [...h.slice(0, 12)].map(b => b.toString(16).padStart(2, '0')).join('') };
}
async function seal(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, MIRROR.key, new TextEncoder().encode(JSON.stringify(obj))));
  const o = new Uint8Array(12 + ct.length); o.set(iv); o.set(ct, 12); return o;
}
async function unseal(bytes){
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:bytes.subarray(0, 12) }, MIRROR.key, bytes.subarray(12));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* glasses side: send the screen whenever it changes, plus a heartbeat so the computer knows it's live */
function mirrorState(){
  const a = document.activeElement, sv = document.querySelector('.showvid'), { mirror, ...data } = P;
  return { v:1, t:now(), V, focus:a && a.dataset ? a.dataset.k || null : null, P:data, wallMoving:wallMoves(),
    SHOW:{ i:SHOW.i, paused:SHOW.paused }, showT:sv ? sv.currentTime : null, K, D, TD,
    W:{ loading:W.loading, place:W.place, err:W.err, city:W.city }, moving,
    wx:winEl.style.getPropertyValue('--wx'), wy:winEl.style.getPropertyValue('--wy') };
}
function mirrorPush(){
  if(WATCH !== null || !MIRROR.client) return;
  clearTimeout(MIRROR.pushT);
  MIRROR.pushT = setTimeout(async () => { try { MIRROR.client.publish(MIRROR.topic, await seal(mirrorState()), true); } catch(e){} }, 120);
}
async function mirrorStart(code){
  mirrorStopLink();
  P.mirror = { on:true, code }; save();
  const k = await mirrorKeys(code); MIRROR.key = k.key; MIRROR.topic = k.topic;
  MIRROR.client = mqttClient(MIRROR_RELAY, (topic, data) => { if(topic === MIRROR.topic + '/v') MIRROR.seenAt = now(); }, st => {
    MIRROR.state = st; if(st === 'on'){ MIRROR.client.subscribe(MIRROR.topic + '/v'); mirrorPush(); }
    set('mirrorStatus', mirrorStatusText()); });
  clearInterval(MIRROR.beat); MIRROR.beat = setInterval(mirrorPush, 8000);
  render();
}
function mirrorStopLink(){
  clearInterval(MIRROR.beat); clearTimeout(MIRROR.pushT);
  if(MIRROR.client){ MIRROR.client.publish(MIRROR.topic, new Uint8Array(0), true); const c = MIRROR.client; setTimeout(() => c.end(), 300); } // clears the last screen from the relay
  MIRROR.client = null; MIRROR.state = 'off'; MIRROR.seenAt = 0;
}
function mirrorStatusText(){
  if(MIRROR.state === 'on') return now() - MIRROR.seenAt < 25000 ? '● A computer is watching' : 'Connected · waiting for a computer';
  return MIRROR.state === 'connecting' ? 'Connecting…' : MIRROR.state === 'offline' ? 'Offline · retrying…' : '';
}
document.addEventListener('focusin', () => { if(MIRROR.client) mirrorPush(); });

/* computer side (?watch=CODE): input is switched off, the glasses' screen is replayed as it arrives */
function mirrorApply(st){
  if(!st || st.v !== 1) return;
  MIRROR.seenAt = now();
  const data = st.P || {};
  for(const k of Object.keys(P)) if(!(k in data)) delete P[k];
  Object.assign(P, data); P.wallMove = !!st.wallMoving;
  if(MODULES.length) SOP = MODULES[P.trainMod] || MODULES[0] || NO_MODULE;
  Object.assign(SHOW, st.SHOW || {}); Object.assign(K, st.K || {}); if(st.D) D = st.D; TD = st.TD || '';
  Object.assign(W, st.W || {}); moving = !!st.moving;
  winEl.style.setProperty('--wx', st.wx || '0px'); winEl.style.setProperty('--wy', st.wy || '0px');
  apply();
  if(JSON.stringify(V) !== JSON.stringify(st.V || {})) setView(st.V || {}); else render(true);
  INPUT_GEN++; // focus repairs must not undo the glasses' highlight
  const el = st.focus && document.querySelector(`[data-k="${CSS.escape(st.focus)}"]`);
  if(el) el.focus({ preventScroll:true });
  const sv = document.querySelector('.showvid');
  if(sv && st.showT != null && Math.abs(sv.currentTime - st.showT) > .4) try { sv.currentTime = st.showT; } catch(e){}
  watchBar();
}
async function mirrorWatch(code){
  const k = await mirrorKeys(code); MIRROR.key = k.key; MIRROR.topic = k.topic;
  MIRROR.client = mqttClient(MIRROR_RELAY, async (topic, data) => {
    if(topic !== MIRROR.topic) return;
    if(!data.length){ MIRROR.stopped = true; watchBar(); return; }
    try { MIRROR.stopped = false; mirrorApply(await unseal(data)); } catch(e){}
  }, st => { MIRROR.state = st; if(st === 'on') MIRROR.client.subscribe(MIRROR.topic); watchBar(); });
  // tell the glasses someone is watching (encrypted, every 10 s)
  setInterval(async () => { try { MIRROR.client.publish(MIRROR.topic + '/v', await seal({ hello:now() }), false); } catch(e){} }, 10000);
  setInterval(watchBar, 1000);
}
function watchBar(){
  const bar = $('#watchbar'); if(!bar) return;
  if(!WATCH){ return; }
  const age = MIRROR.seenAt ? Math.round((now() - MIRROR.seenAt) / 1000) : null;
  const live = age != null && age < 20 && !MIRROR.stopped;
  const msg = MIRROR.state !== 'on' ? (MIRROR.state === 'offline' ? 'Relay offline · retrying…' : 'Connecting to the relay…')
    : MIRROR.stopped ? 'The glasses stopped mirroring' : !MIRROR.seenAt ? 'Waiting for the glasses… (Settings → Mirror to a computer)'
    : live ? 'Live' : `No update for ${age} s · the glasses may be asleep`;
  bar.querySelector('.ws').textContent = msg;
  bar.classList.toggle('live', live);
  $('#watchwait').style.display = MIRROR.seenAt && !MIRROR.stopped ? 'none' : '';
}
function setupWatch(){
  document.body.classList.add('watching');
  document.body.insertAdjacentHTML('afterbegin', `<div id="watchbar"><b>SiteVue.AR Home</b><span class="wdot"></span>
    ${WATCH ? `<span>Watching <b>${fmtCode(WATCH)}</b></span><span class="ws"></span>`
      : `<span>Enter the code shown on the glasses (Settings → Mirror to a computer)</span>
         <form id="watchform"><input id="watchcode" maxlength="9" placeholder="ABCD-2345" autocomplete="off" autofocus><button>Watch</button></form>`}</div>`);
  $('#stage').insertAdjacentHTML('beforeend', `<div id="watchwait">${WATCH ? '<div class="spinner"></div>' : ''}<div>${WATCH ? 'Waiting for the glasses…' : 'Enter the code above'}</div></div>`);
  const fit = () => document.documentElement.style.setProperty('--vz', Math.max(.5, Math.min(2.2, (innerWidth - 32) / 600, (innerHeight - 90) / 600)));
  fit(); addEventListener('resize', fit);
  const form = $('#watchform');
  if(form) form.addEventListener('submit', e => { e.preventDefault(); const c = $('#watchcode').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if(c.length === 8) location.search = '?watch=' + c; });
  if(WATCH) mirrorWatch(WATCH);
}

/* ---------- Wallpaper photo ----------
   The glasses have no photo library, so the photo is chosen on the iPhone: Settings → Wallpaper photo shows a code,
   the iPhone opens /photo, picks a picture from Photos, and it's squared to 600 x 600 and sent encrypted (same relay and
   AES-GCM scheme as mirroring, its own channel) straight to the glasses. On a phone or computer the app can also pick a
   photo directly. The photo is kept on the device in its own storage slot (not in P, so mirroring stays light). */
const PHOTO_KEY = 'sitevue-ar-wallphoto';
const PHOTO = { client:null, code:'', state:'off' };
const wallPhoto = () => { try { return localStorage.getItem(PHOTO_KEY) || ''; } catch(e){ return ''; } };
function setWallPhoto(dataURL){
  try { if(dataURL) localStorage.setItem(PHOTO_KEY, dataURL); else localStorage.removeItem(PHOTO_KEY); } catch(e){ toast('Not enough space for that photo'); return; }
  showWallPhoto(); wallPlay(); refreshTheme();
}
function showWallPhoto(){
  const u = wallPhoto(), el = $('#wallimg');
  el.style.backgroundImage = u ? `url("${u}")` : ''; el.classList.toggle('on', !!u);
  $('#wall').classList.toggle('hidden', !!u);
}
// any picture (iPhone photos arrive as JPEG) → a centered 600 x 600 square JPEG, about 60–120 KB
function squarePhoto(file){
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 600;
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, 600, 600);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', .82)); };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('That file isn’t a photo this browser can open')); };
    img.src = url;
  });
}
async function photoKeys(code){ const k = await mirrorKeys('photo:' + code); return k; } // a channel of its own, separate from mirroring
// glasses side: wait for a photo on the code's channel
async function photoReceive(){
  photoStop();
  PHOTO.code = mirrorCode();
  const k = await photoKeys(PHOTO.code), key = k.key;
  PHOTO.client = mqttClient(MIRROR_RELAY, async (topic, data) => {
    if(topic !== k.topic || !data.length) return;
    try {
      const iv = data.subarray(0, 12), pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data.subarray(12));
      const msg = JSON.parse(new TextDecoder().decode(pt));
      if(msg.img && msg.img.startsWith('data:image/')){
        setWallPhoto(msg.img); PHOTO.client.publish(k.topic, new Uint8Array(0), true); // clear it from the relay
        toast('Wallpaper updated'); photoStop(); if(V.app === 'settings') render();
      }
    } catch(e){}
  }, st => { PHOTO.state = st; if(st === 'on') PHOTO.client.subscribe(k.topic); set('photoStatus', photoStatusText()); });
  render();
}
function photoStop(){ if(PHOTO.client){ const c = PHOTO.client; setTimeout(() => c.end(), 400); } PHOTO.client = null; PHOTO.code = ''; PHOTO.state = 'off'; }
const photoStatusText = () => PHOTO.state === 'on' ? 'Waiting for your photo…' : PHOTO.state === 'connecting' ? 'Connecting…' : PHOTO.state === 'offline' ? 'Offline · retrying…' : '';
// pick a photo right here (phones and computers; the glasses have no file picker)
function pickHere(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => { const f = inp.files && inp.files[0]; if(!f) return;
    try { setWallPhoto(await squarePhoto(f)); toast('Wallpaper updated'); render(); } catch(e){ toast(e.message); } };
  inp.click();
}
// the iPhone page (?photo=CODE, or /photo): choose a photo, preview it, send it to the glasses
function setupPhotoSend(){
  $('#boot') && $('#boot').remove();
  const vp = document.querySelector('meta[name=viewport]'); if(vp) vp.content = 'width=device-width, initial-scale=1'; // a normal phone page, not the 600 px lens
  document.body.classList.add('photosend');
  document.body.insertAdjacentHTML('beforeend', `<div id="photosend">
    <h1>Send a wallpaper to your glasses</h1>
    <p>On the glasses, open <b>Settings → Wallpaper photo → Get a photo from my iPhone</b> and enter the code it shows.</p>
    <input id="ps-code" maxlength="9" placeholder="ABCD-2345" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="send" inputmode="text" value="${PHOTOSEND ? fmtCode(PHOTOSEND) : ''}">
    <label class="ps-btn" for="ps-file">Choose a photo</label><input id="ps-file" type="file" accept="image/*" hidden>
    <div id="ps-preview"></div>
    <button id="ps-send" class="ps-btn primary" disabled>Send to glasses</button>
    <p id="ps-status"></p>
    <p class="ps-note">The photo is squared, encrypted with the code and sent through a public relay that can't see it.</p></div>`);
  let img = '';
  const status = t => $('#ps-status').textContent = t;
  const ready = () => { $('#ps-send').disabled = !(img && $('#ps-code').value.toUpperCase().replace(/[^A-Z0-9]/g, '').length === 8); };
  $('#ps-code').addEventListener('input', ready);
  $('#ps-file').addEventListener('change', async e => { const f = e.target.files && e.target.files[0]; if(!f) return;
    try { img = await squarePhoto(f); $('#ps-preview').style.backgroundImage = `url("${img}")`; $('#ps-preview').classList.add('on'); status(''); } catch(err){ status(err.message); }
    ready(); });
  $('#ps-send').addEventListener('click', async () => {
    const code = $('#ps-code').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if(code.length !== 8 || !img) return;
    $('#ps-send').disabled = true; status('Sending…');
    const k = await photoKeys(code), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, k.key, new TextEncoder().encode(JSON.stringify({ img }))));
    const payload = new Uint8Array(12 + ct.length); payload.set(iv); payload.set(ct, 12);
    const c = mqttClient(MIRROR_RELAY, () => {}, st => {
      if(st === 'on'){ c.publish(k.topic, payload, true); status('Sent! It appears on the glasses in a moment.'); setTimeout(() => c.end(), 1500); $('#ps-send').disabled = false; }
      else if(st === 'offline') status('Couldn’t reach the relay. Check the connection and try again.');
    });
  });
}

/* ---------- app colors from the wallpaper ----------
   With the SiteVue wallpaper the apps keep the brand colors above. With your own photo, every distinct color in it is
   found (on a 64 x 64 copy) and each app gets a different one as a light-to-deep gradient: the most common to Clock In,
   the rest flowing around the wheel by hue, covering the whole photo, small accents included (Master Chief: armor
   greens, visor gold, grays, black). A photo with only a few colors repeats them in lighter and darker shades. Every color is kept bright enough to show on the lens (pure black is
   see-through there) and dark enough for the white icon art. */
const THEME_KEY = 'sitevue-ar-wallphoto-theme';
let THEME = null; // { id: [light, deep] } for a photo, or null for the brand colors
function rgb2hsl(r, g, b){
  r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2; let h = 0, s = 0;
  if(mx !== mn){ const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  return [h, s * 100, l * 100];
}
const hsl = (h, s, l) => `hsl(${Math.round(h)} ${Math.round(s)}% ${Math.round(l)}%)`;
function photoTheme(dataURL){
  return new Promise(ok => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); g.drawImage(img, 0, 0, 64, 64);
      const d = g.getImageData(0, 0, 64, 64).data, px = [];
      for(let i = 0; i < d.length; i += 4) px.push([d[i], d[i + 1], d[i + 2]]);
      // find every distinct color: k-means seeded by farthest points (so a small gold visor or a red light gets its own
      // seed instead of being swallowed by big areas), with a perceptual color distance
      const dist = (a, b) => { const r = (a[0] + b[0]) / 2, dr = a[0] - b[0], dg = a[1] - b[1], db = a[2] - b[2];
        return Math.sqrt((2 + r / 256) * dr * dr + 4 * dg * dg + (2 + (255 - r) / 256) * db * db); };
      let cs = [px[px.length >> 1].slice()];
      while(cs.length < 16){ let best = null, bd = -1;
        for(const p of px){ let m = Infinity; for(const q of cs){ const dd = dist(p, q); if(dd < m) m = dd; } if(m > bd){ bd = m; best = p; } }
        if(bd < 20) break; cs.push(best.slice()); }
      let groups = [];
      for(let it = 0; it < 8; it++){
        groups = cs.map(() => []);
        for(const p of px){ let bi = 0, bd = Infinity; cs.forEach((q, k) => { const dd = dist(p, q); if(dd < bd){ bd = dd; bi = k; } }); groups[bi].push(p); }
        cs = groups.map((gr, k) => gr.length ? [0, 1, 2].map(j => gr.reduce((a, p) => a + p[j], 0) / gr.length) : cs[k]);
      }
      const found = cs.map((q, k) => ({ q, n:groups[k].length })).filter(c => c.n >= px.length * .003).sort((a, b) => b.n - a.n); // small accents count too
      // keep the colors that differ most from each other, up to one per app: the most common one first (Clock In)
      const sel = [found[0]];
      while(sel.length < APPS.length){ let best = null, bd = -1;
        for(const c of found){ if(sel.includes(c)) continue; const m = Math.min(...sel.map(x => dist(c.q, x.q))); if(m > bd){ bd = m; best = c; } }
        if(!best || bd < 24) break; sel.push(best); }
      const tone = c => { const [h, s, l] = rgb2hsl(...c.q); return { h, s, l }; };
      // around the wheel the colors flow by hue (grays last, dark to light), so neighbors blend like the photo does
      const ring = sel.slice(1).map(tone).sort((a, b) => (a.s < 12) - (b.s < 12) || (a.s < 12 ? a.l - b.l : a.h - b.h));
      const pool = [tone(sel[0]), ...ring];
      const order = [CENTER, ...APPS.map(a => a.id).filter(id => id !== CENTER)], out = {};
      const used = [], shifts = [0, 10, -8, 18, -14, 6, 24, -4, 14];
      order.forEach((id, i) => {
        // fewer colors than apps (a simple photo): reuse them in lighter and darker shades
        const b = pool[i] || pool[1 + (i - 1) % Math.max(1, pool.length - 1)] || pool[0], again = i >= pool.length;
        const s = Math.min(b.s, 85) * (b.s < 12 ? 1 : .95);
        let deep = clamp(b.l * .7 + (again ? shifts[i] : 0), 22, 46);   // visible on the lens, dark enough for white art
        for(let tries = 0; tries < 6 && used.some(u => Math.abs(u[0] - b.h) < 12 && Math.abs(u[1] - deep) < 5); tries++) deep = deep + 7 > 46 ? deep - 13 : deep + 7;
        deep = clamp(deep, 22, 46); used.push([b.h, deep]);
        const light = clamp(deep + 26, 48, 80);
        out[id] = [hsl(b.h, Math.min(s + 6, 90), light), hsl(b.h, s, deep)];
      });
      ok(out);
    };
    img.onerror = () => ok(null);
    img.src = dataURL;
  });
}
function loadTheme(){
  try { THEME = wallPhoto() ? JSON.parse(localStorage.getItem(THEME_KEY) || 'null') : null; } catch(e){ THEME = null; }
  if(wallPhoto() && !THEME) refreshTheme(); // a photo saved before its colors were (e.g. sent to an older version): work them out now
}
async function refreshTheme(){
  const u = wallPhoto();
  THEME = u ? await photoTheme(u) : null;
  try { if(THEME) localStorage.setItem(THEME_KEY, JSON.stringify(THEME)); else localStorage.removeItem(THEME_KEY); } catch(e){}
  render();
}

/* ---------- staying up to date ----------
   The glasses (and browsers) can keep running an old saved copy of the app long after a new version is published.
   So the app asks the site for the latest version now and then (at start, every 5 minutes, and whenever it comes back
   to the front); if a newer one exists it refreshes the saved copy and reloads, but only on the Home screen, never in
   the middle of using an app. APP_BUILD changes with every publish. */
const APP_BUILD = '2026-11-03-05';
let UPDATE_READY = false;
async function checkForUpdate(){
  if(WATCH !== null || PHOTOSEND !== null || UPDATE_READY || location.protocol === 'file:') return;
  try {
    const url = location.pathname + '?build-check=' + now();
    const txt = await (await fetch(url, { cache:'no-store' })).text(), m = txt.match(/const APP_BUILD = '([^']+)'/);
    if(m && m[1] !== APP_BUILD){
      try { if(sessionStorage.getItem('sv-upd') === m[1]) return; sessionStorage.setItem('sv-upd', m[1]); } catch(e){}
      await fetch(location.pathname, { cache:'reload' }).catch(() => {}); // replace the saved copy with the new one
      UPDATE_READY = true; applyUpdateWhenIdle();
    }
  } catch(e){}
}
function applyUpdateWhenIdle(){
  if(!UPDATE_READY) return;
  if(V.app || V.cc || RING.on) return; // wait until you're back on Home
  toast('Updating to the latest version…', 3000);
  setTimeout(() => location.reload(), 900);
}
setTimeout(checkForUpdate, 12000); // after the intro, so it never competes with it
setInterval(checkForUpdate, 5 * 60000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkForUpdate(); });
addEventListener('popstate', () => setTimeout(applyUpdateWhenIdle, 600)); // returning to Home is the moment to update

/* ---------- boot ---------- */
const WALL_SPEED = 1; // the file is already slowed to 60% (600x600, 18 fps), so it plays at its native rate - cheaper to decode
// some browsers reset the rate when the source (re)loads
$('#wall').addEventListener('loadedmetadata', e => { e.target.defaultPlaybackRate = e.target.playbackRate = WALL_SPEED; });
function apply(){
  const r = document.documentElement.style;
  r.setProperty('--accent', P.accent); r.setProperty('--ts', P.ts); r.setProperty('--bright', P.bright);
  document.body.classList.toggle('reduce', P.reduce);
  r.setProperty('--wall', P.wall); r.setProperty('--see', P.see);
  const w = $('#wall');
  w.defaultPlaybackRate = w.playbackRate = WALL_SPEED;
  wallPlay();
}
// the video only plays on Home: it freezes (dimmed) behind app windows and Control Center, under Reduce Motion, and at 0%.
// Decoding it is the biggest steady cost on the glasses.
// While a Training animation is on screen, the wallpaper lets go of its video entirely (its still poster stays behind):
// small wearable chips often have one hardware video decoder, and a paused wallpaper still holds it.
let WALL_T = 0;
// On the lens the wallpaper is a still picture by default: decoding video costs the glasses CPU, battery and their
// only video decoder. Settings → Animated Background turns it back on. (Lens = a 600 x 600 viewport that isn't the Mac app.)
const isLens = () => innerWidth <= 600 && innerHeight <= 600 && !(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.svLocation);
const wallMoves = () => P.wallMove != null ? P.wallMove : !isLens();
function wallPlay(){
  const w = $('#wall'); if(!w) return;
  const freeDecoder = $('#stage').classList.contains('booting') || !!wallPhoto() || !wallMoves() || P.see || V.app === 'training' && (V.arg === 'step' || V.arg === 'show') && typeof hasVideo === 'function' && hasVideo();
  if(freeDecoder){
    if(w.getAttribute('src')){ WALL_T = w.currentTime || 0; w.pause(); w.removeAttribute('src'); w.load(); }
    return;
  }
  if(!w.getAttribute('src')){
    w.src = 'wallpaper.mp4';
    w.addEventListener('loadedmetadata', () => { try { w.currentTime = WALL_T % (w.duration || 1); } catch(e){} }, { once:true });
  }
  if(P.reduce || P.wall <= 0 || V.app || V.cc) w.pause(); else if(w.paused) w.play().catch(() => {});
}
// make every animation in a window really start: set muted/inline as properties (some built-in browsers ignore the
// attributes on video added by code) and ask it to play now and again once it can
function startVideos(root){
  for(const v of root.querySelectorAll('video')){
    v.muted = true; v.defaultMuted = true; v.playsInline = true; v.setAttribute('playsinline', '');
    if(!v.autoplay) continue;
    const go = () => { if(v.isConnected && v.paused && !v.ended && !(v.classList.contains('showvid') && SHOW.paused)) v.play().catch(() => {}); };
    go(); v.addEventListener('loadeddata', go, { once:true }); v.addEventListener('canplay', go, { once:true });
  }
}
if(navigator.getBattery) navigator.getBattery().then(b => { BAT = b; b.addEventListener('levelchange', () => tick()); }).catch(() => {});
apply();
history.replaceState({}, '');
if(isLens()) document.body.classList.add('lens');
loadTheme();
render(true);
runIntro();
showWallPhoto();
if(PHOTOSEND !== null) setupPhotoSend();
else if(WATCH !== null) setupWatch();
else if(P.mirror && P.mirror.on && P.mirror.code) mirrorStart(P.mirror.code); // keep mirroring across restarts until stopped
</script>
</body>
</html>
