<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="description" content="SiteVue.AR Home: a visionOS-style Home View, apps and Control Center for the Meta Ray-Ban Display lens, driven by the Meta Neural Band.">
<meta name="application-name" content="SiteVue.AR Home">
<meta name="mrbd-web-app-capable" content="yes">
<link rel="icon" href="icon-96.png" sizes="96x96">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07060d">
<title>SiteVue.AR Home</title>
<style>
/* 600x600 additive waveguide: black = transparent, so "glass" is a dim lit fill, never a backdrop blur. */
:root{
  --accent:#64d2ff; --ts:1; --bright:1;
  --glass-a:rgba(255,255,255,.12); --glass-b:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.14);
  --edge:rgba(255,255,255,.16); --ink:#fff; --ink-2:rgba(255,255,255,.68); --ink-3:rgba(255,255,255,.44);
  --halo:0 0 0 3px rgba(255,255,255,.92),0 0 10px rgba(255,255,255,.3);
  --spring:cubic-bezier(.2,.9,.25,1.12); --ease:cubic-bezier(.25,.8,.25,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--ts))}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden}
/* touch-action:none opts in to Neural Band pinch-and-drag (pointer events); read once at load */
body{touch-action:none;display:grid;place-items:center;min-width:600px;min-height:600px}
button,textarea,input{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
:focus{outline:none}
svg{display:block}
#stage{position:relative;width:600px;height:600px;overflow:hidden;background:#000;isolation:isolate}
/* rounded lens corners: a static black frame drawn on top (black is see-through on the lens). Cheaper than a rounded clip,
   which makes the GPU mask the video and every layer on each frame */
#stage::after{content:"";position:absolute;inset:0;border-radius:48px;box-shadow:0 0 0 60px #000;pointer-events:none;z-index:20}
#wall{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:calc(var(--wall) * (1 - var(--see,0)));transition:opacity .4s var(--ease);pointer-events:none}
#wall.under{opacity:calc(var(--wall) * .45 * (1 - var(--see,0)))}
/* Transparency (--see) fades the whole app so the outside world shows through the lens; capped at 85% so it never vanishes */
#ui{position:absolute;inset:0;opacity:calc(var(--bright) * (1 - var(--see,0)));transition:opacity .2s}
.glass{background:linear-gradient(180deg,var(--glass-a),var(--glass-b));border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.g2{background:var(--glass-2);border-radius:22px}
.eyebrow{font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.title{font-size:1.75rem;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.sub{color:var(--ink-2);font-size:1.05rem}
.dim{color:var(--ink-3)}
button:focus,[tabindex="0"]:focus,textarea:focus,input:focus{box-shadow:var(--halo)}

/* ---------- Home View ---------- */
#home{position:absolute;inset:0;transition:opacity .35s var(--ease),scale .45s var(--spring)}
#home.behind{opacity:0;scale:.9;pointer-events:none}
#home.dimmed{opacity:.06}
#ccBtn{position:absolute;top:10px;left:50%;translate:-50% 0;width:64px;height:40px;border-radius:20px;
  display:grid;place-items:center;color:var(--ink-2);transition:width .25s var(--spring),color .2s}
#ccBtn svg{width:26px;height:26px}
#ccBtn:focus{width:84px;color:#fff}
.tabs{position:absolute;left:14px;top:50%;translate:0 -50%;display:flex;flex-direction:column;gap:10px;
  padding:8px;border-radius:40px;z-index:2}
.tab{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.tab svg{width:28px;height:28px}
.tab.sel{background:rgba(255,255,255,.22);color:#fff}
.tab .lbl{position:absolute;left:66px;top:50%;translate:0 -50%;white-space:nowrap;font-size:1.05rem;font-weight:600;
  padding:10px 16px;border-radius:22px;background:rgba(40,40,44,.96);border:1px solid var(--edge);
  opacity:0;scale:.85;transform-origin:left center;pointer-events:none;transition:opacity .18s,scale .25s var(--spring)}
.tab:focus .lbl{opacity:1;scale:1}
.icon{position:absolute;width:96px;display:flex;flex-direction:column;align-items:center;gap:9px;border-radius:50%}
.icon:focus{box-shadow:none}
.disc{position:relative;width:88px;height:88px;border-radius:50%;transition:scale .3s var(--spring),box-shadow .2s}
.disc .bg{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 34% 24%,var(--c1),var(--c2) 78%)}
.disc::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 32% 20%,rgba(255,255,255,.42),transparent 52%);pointer-events:none}
.disc .fg{position:absolute;inset:0;display:grid;place-items:center;transition:translate .3s var(--spring),scale .3s var(--spring)}
.disc .fg svg{width:44px;height:44px}
.disc .ini{font-size:30px;font-weight:700;letter-spacing:.02em}
.icon .nm{font-size:.95rem;font-weight:600;color:var(--ink-2);white-space:nowrap;line-height:1.15;text-align:center}
.icon .nm small{display:block;font-size:.8rem;font-weight:500;color:var(--ink-3)}
/* gaze highlight: the disc lifts, the glyph layer moves further than the backplate (parallax) */
.icon:focus .disc{scale:1.12;box-shadow:0 0 0 3px rgba(255,255,255,.92),0 0 14px var(--c1)}
.icon:focus .fg{scale:1.08;translate:0 -3px}
.icon:focus .nm{color:#fff}
.empty{position:absolute;left:110px;right:24px;top:300px;text-align:center}
.status{position:absolute;bottom:16px;left:50%;translate:-50% 0;display:flex;align-items:center;gap:14px;
  padding:9px 20px;border-radius:24px;font-size:1rem;font-weight:600;white-space:nowrap}
.status .sep{width:4px;height:4px;border-radius:50%;background:var(--ink-3)}
.status .live{color:var(--accent)}
.bat{display:inline-flex;align-items:center;gap:6px}
.bat svg{width:26px;height:26px}

/* ---------- Sliders (Digital Crown analogue) ---------- */
.slider{display:flex;align-items:center;gap:14px;width:100%;height:64px;padding:0 20px;border-radius:32px;
  background:var(--glass-2);text-align:left}
.slider svg{width:26px;height:26px;flex:0 0 auto}
.slider .sl-l{font-weight:600;font-size:1.05rem;width:108px;flex:0 0 auto}
.slider .track{flex:1;height:12px;border-radius:6px;background:rgba(255,255,255,.16);overflow:hidden}
.slider .track i{display:block;height:100%;background:#fff;border-radius:6px}
.slider .sl-v{width:52px;text-align:right;font-weight:600;color:var(--ink-2)}
.slider:focus .track i{background:var(--accent)}
/* inside a list (Settings), sliders match the other rows exactly and never get squeezed */
.list .slider{flex:0 0 auto;height:auto;min-height:62px;padding:10px 20px;border-radius:22px;background:var(--glass-b)}

/* ---------- Windows ---------- */
#win{position:absolute;inset:0;display:none;--wx:0px;--wy:0px}
#win.open{display:block}
.window{position:absolute;left:30px;top:22px;width:540px;height:480px;border-radius:38px;padding:22px 26px;
  display:flex;flex-direction:column;gap:12px;translate:var(--wx) var(--wy)}
.window.enter{animation:winIn .42s var(--spring)}
@keyframes winIn{from{scale:.2;opacity:0}to{scale:1;opacity:1}}
.winbar{position:absolute;top:514px;left:50%;display:flex;align-items:center;gap:12px;
  translate:calc(-50% + var(--wx)) var(--wy)}
.winbar .close{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.winbar .close svg{width:22px;height:22px}
.winbar .grab{width:170px;height:48px;border-radius:24px;display:grid;place-items:center}
.winbar .grab i{display:block;width:130px;height:10px;border-radius:5px;background:rgba(255,255,255,.42)}
.winbar .grab.moving i{background:var(--accent);box-shadow:0 0 18px var(--accent)}
.row2{display:flex;gap:10px}
.btn{min-height:58px;border-radius:29px;padding:0 24px;font-weight:600;font-size:1.1rem;background:var(--glass-2);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1}
.btn.primary{background:var(--accent);color:#000}
.btn.danger{color:#ff8a84}
.btn svg{width:22px;height:22px}
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:10px 20px;
  border-radius:22px;background:var(--glass-b);text-align:left;font-size:1.08rem;flex:0 0 auto}
.lrow b{font-weight:600}
.lrow .r{color:var(--ink-2);text-align:right;white-space:nowrap}
.lrow .sw{width:26px;height:26px;border-radius:50%}
.lrow .tog{width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.2);position:relative;flex:0 0 auto}
.lrow .tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s var(--spring)}
.lrow .tog.on{background:#30d158}
.lrow .tog.on::after{left:23px}
.spin{display:flex;align-items:center;justify-content:space-between;min-height:62px;padding:0 20px;border-radius:31px;
  background:var(--glass-2);font-size:1.2rem;font-weight:600;width:100%}
.spin .ar{color:var(--ink-3);font-size:1.1rem}
.spin:focus .ar{color:var(--accent)}
.dev{justify-content:flex-start;gap:14px}
.dev svg{width:30px;height:30px;flex:0 0 auto}
.dev .st{display:block;font-size:.9rem;color:var(--ink-2);font-weight:500;margin-top:2px}
.dev .r{margin-left:auto}
.dot2{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#ffd60a;vertical-align:1px}
.dot2.ok{background:#30d158}
.steps{margin:0;padding-left:1.4em;font-size:1.05rem;line-height:1.45}
.steps li{margin:6px 0}
.trk{display:flex;align-items:center;gap:10px;font-size:.85rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.trk .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.trk .bar i{display:block;height:100%;background:var(--accent)}
.sttl{font-size:1.45rem;font-weight:700;line-height:1.2}
.sdet{font-size:1rem;line-height:1.4;color:var(--ink-2)}
.call{border-radius:18px;padding:10px 14px;font-size:.92rem;line-height:1.35;background:rgba(255,214,10,.12);border:1px solid rgba(255,214,10,.45)}
.call b{display:block;font-size:.78rem;letter-spacing:.08em;color:#ffd60a}
.call.caution{background:rgba(255,99,90,.12);border-color:rgba(255,120,110,.5)}
.call.caution b{color:#ff8a84}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.12)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.45);flex:0 0 auto;display:grid;place-items:center}
.chk.on{background:#30d158;border-color:#30d158}
.chk svg{width:16px;height:16px;stroke-width:3}
.grp{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:8px 6px 0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;flex:1}

/* app specifics */
.bigtime{font-size:4.8rem;font-weight:600;letter-spacing:-.03em;line-height:1}
.wc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.wcard{padding:12px 18px;border-radius:22px;background:var(--glass-b)}
.wcard b{display:block;font-size:1.7rem;font-weight:600}
.wcard small{color:var(--ink-3);font-size:.9rem}
.ring{position:relative;width:150px;height:150px;margin:0 auto;flex:0 0 auto}
.ring svg{width:150px;height:150px;rotate:-90deg}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;font-size:2.3rem;font-weight:600;letter-spacing:-.02em}
.ring .rt small{display:block;font-size:.95rem;font-weight:500;color:var(--ink-2);text-align:center;letter-spacing:0}
.presets{display:flex;gap:8px}
.presets .btn{min-height:52px;padding:0 10px;font-size:1rem}
.presets .btn.on{background:#fff;color:#000}
.seg{display:flex;gap:6px;padding:5px;border-radius:30px;background:var(--glass-b);align-self:center;flex:0 0 auto}
.seg button{height:48px;padding:0 18px;border-radius:24px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:1.02rem;color:var(--ink-2)}
.seg button svg{width:20px;height:20px}
.seg button.sel{background:rgba(255,255,255,.22);color:#fff}
.swtime{font-size:4.6rem;font-weight:600;letter-spacing:-.03em;text-align:center;line-height:1.1}
.calc-d{text-align:right;font-weight:500;line-height:1;padding:6px 8px 4px;min-height:70px;white-space:nowrap;overflow:hidden}
.calc-d small{display:block;font-size:1rem;color:var(--ink-3);min-height:20px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;flex:1}
.keys button{border-radius:24px;background:var(--glass-2);font-size:1.5rem;font-weight:600}
.keys .op{background:rgba(255,159,10,.85);color:#000}
.keys .op.on{background:#fff}
.keys .fn{background:rgba(255,255,255,.3)}
.dial{position:relative;width:230px;height:230px;margin:0 auto}
.dial svg{width:230px;height:230px;transition:rotate .2s linear}
.dial .needle{position:absolute;left:50%;top:-4px;translate:-50% 0;width:0;height:0;
  border-left:10px solid transparent;border-right:10px solid transparent;border-top:16px solid var(--accent)}
.wx-now{display:flex;align-items:center;gap:20px}
.wx-now .t{font-size:5rem;font-weight:600;letter-spacing:-.03em;line-height:1}
.wx-days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wx-days div{background:var(--glass-b);border-radius:18px;padding:10px 4px;text-align:center;font-size:.95rem}
.wx-days b{display:block;font-size:1.15rem}
textarea{width:100%;flex:1;min-height:0;resize:none;border-radius:24px;background:var(--glass-b);padding:16px 18px;
  font-size:1.25rem;line-height:1.35;cursor:text}
input[type=text]{width:100%;height:62px;border-radius:31px;background:var(--glass-2);padding:0 22px;font-size:1.2rem;cursor:text}
textarea::placeholder,input::placeholder{color:var(--ink-3)}
.avatar-lg .disc{width:120px;height:120px}
.avatar-lg .disc .ini{font-size:42px}

/* ---------- Control Center ---------- */
#cc{position:absolute;inset:0;display:none}
#cc.open{display:block}
.ccpanel{position:absolute;left:56px;top:18px;width:488px;border-radius:38px;padding:20px;display:flex;flex-direction:column;gap:12px}
.ccpanel.enter{animation:ccIn .38s var(--spring)}
@keyframes ccIn{from{translate:0 -40px;opacity:0}to{translate:0 0;opacity:1}}
.cchead{display:flex;justify-content:space-between;align-items:flex-start;padding:0 6px}
.cctime{font-size:2.6rem;font-weight:600;letter-spacing:-.02em;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tiles .tile{grid-column:span 2}
.tiles .tile:nth-child(n+4){grid-column:span 3}
.tile{height:92px;border-radius:26px;background:var(--glass-2);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:7px;font-size:.88rem;font-weight:600;text-align:center;line-height:1.1}
.tile svg{width:28px;height:28px}
.tile.on{background:rgba(255,255,255,.88);color:#000}
.ccclose{align-self:center;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto}
.ccclose svg{width:24px;height:24px}
.ccclose:focus{color:#fff}

/* ---------- boot intro ---------- */
#boot{position:absolute;inset:0;z-index:8;perspective:700px;overflow:hidden;transition:opacity .5s var(--ease),scale .6s var(--ease)}
#boot.out{opacity:0;scale:1.06;pointer-events:none}
#boot .glow{position:absolute;left:50%;top:50%;width:540px;height:230px;translate:-50% -50%;border-radius:50%;opacity:0;transition:opacity .6s;
  background:radial-gradient(closest-side,rgba(76,82,249,.55),rgba(42,7,246,.18) 60%,transparent)}
@property --dz{syntax:'<length>';inherits:true;initial-value:0px}
#boot .logo,#boot .pcs{position:absolute;left:60px;top:266px;width:480px;height:68px;transform-style:preserve-3d}
#boot .pcs{left:0;top:0}
#boot .pc{position:absolute;transform-style:preserve-3d;will-change:transform;--dz:3.6px} /* fixed thickness: only transform animates, so it stays on the GPU */
#boot .ly{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#boot .whole{position:absolute;inset:0;width:100%;height:100%;overflow:visible;opacity:0;transition:opacity .25s}
#boot.lit .glow,#boot.lit .whole{opacity:1}
/* once still, the logo grows slightly for exactly as long as the light takes to cross it */
#boot .logo,#boot .glow{transition:scale var(--sweep,1.5s) cubic-bezier(.3,.2,.5,1),opacity .6s}
#boot.lit .logo,#boot.lit .glow{scale:1.08}
#boot.lit .pcs{visibility:hidden}
#boot .wh{opacity:0;transition:opacity .22s}
#boot .wh.on{opacity:1}
#home.boot{opacity:0}

/* ---------- toast ---------- */
#toast{position:absolute;top:14px;left:50%;translate:-50% -80px;padding:12px 22px;border-radius:26px;font-size:1.05rem;
  font-weight:600;white-space:nowrap;z-index:9;transition:translate .35s var(--spring),opacity .25s;opacity:0;pointer-events:none;
  background:rgba(44,44,48,.97);border:1px solid var(--edge)}
#toast.show{translate:-50% 0;opacity:1}

.reduce *{transition:none!important}
.reduce .window,.reduce .ccpanel{animation:none!important}

/* desktop testing only: frame the 600x600 lens */
@media (min-width:700px) and (min-height:700px){
  #stage{outline:1px solid #2a2a2e}
  #help{display:block}
}
#help{display:none;position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#666;font-size:13px}
</style>
</head>
<body>
<div id="stage">
  <video id="wall" src="wallpaper.mp4" poster="wallpaper.jpg" muted autoplay loop playsinline preload="auto" aria-hidden="true"></video>
  <div id="ui">
    <div id="home"></div>
    <div id="win" role="dialog"></div>
    <div id="cc" role="dialog" aria-label="Control Center"></div>
  </div>
  <div id="boot" aria-label="SiteVue AI">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <linearGradient id="bootFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9fc"/><stop offset=".45" stop-color="#8fa4ff"/><stop offset="1" stop-color="#4c52f9"/></linearGradient>
      <linearGradient id="bootShine" gradientUnits="userSpaceOnUse" x1="-900" y1="0" x2="0" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        <animateTransform id="bootSweep" attributeName="gradientTransform" type="translate" from="0 0" to="4500 0" dur="1.5s" begin="indefinite" fill="freeze"/>
      </linearGradient>
    </defs></svg>
    <div class="glow"></div>
    <div class="logo"><div class="pcs"></div><svg class="whole" viewBox="0 0 3526 494" aria-hidden="true"></svg></div>
  </div>
  <div id="toast" role="status"></div>
</div>
<div id="help">Arrow keys = thumb swipe · Enter = index pinch · Esc = back (middle pinch) · mouse hover = gaze</div>
<script src="sop.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const h = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const now = () => Date.now();

/* ---------- persisted state (glasses localStorage, 5 MB) ---------- */
const KEY = 'sitevue-ar-home-v1';
const DEF = { accent:'#64d2ff', ts:1, bright:1, reduce:false, dnd:false, wall:.7, see:0, tab:'apps',
  people:[], notes:[], timer:{ dur:300000, end:null, left:null }, sw:{ start:null, acc:0, laps:[] }, units:'F', wx:null };
const P = Object.assign({}, DEF, load());
if(P.tab !== 'people') P.tab = 'apps'; // older saves may point at the removed Environments tab
if(P.wallV !== 2){ P.wall = .7; P.wallV = 2; }
if(P.brightV !== 2){ if(P.bright === .9) P.bright = 1; P.brightV = 2; } // old default; 100% avoids a costly full-screen blend // the SiteVue-palette wallpaper is darker, so start it stronger once
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e){} }, 120); }

/* ---------- glyphs ---------- */

/* ---------- formatting ---------- */
const fmtTime = (d, tz) => d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit', timeZone:tz });
const fmtDate = d => d.toLocaleDateString([], { weekday:'long', month:'long', day:'numeric' });
function fmtDur(ms, tenths){
  ms = Math.max(0, ms); const t = tenths ? ms / 1000 : Math.ceil(ms / 1000), hh = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = Math.floor(t % 60);
  const base = (hh ? hh + ':' + String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0');
  return tenths ? base + '.' + Math.floor((ms % 1000) / 100) : base;
}
function tzDiff(tz){
  const d = new Date(), a = new Date(d.toLocaleString('en-US', { timeZone:tz })), b = new Date(d.toLocaleString('en-US'));
  const hrs = Math.round((a - b) / 1800000) / 2;
  return hrs === 0 ? 'Same time' : (hrs > 0 ? '+' : '−') + Math.abs(hrs) + ' hr';
}
const initials = n => n.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
function hue(n){ let x = 0; for(const c of n) x = (x * 31 + c.charCodeAt(0)) % 360; return x; }

/* ---------- view state + history (host allows 5 entries; we never go deeper than 3) ---------- */
let V = {}, winAnim = false, ccAnim = false, moving = false, confirmKey = null, restore = {};
const homeEl = $('#home'), winEl = $('#win'), ccEl = $('#cc');
function open(app, arg){
  const st = { app, arg };
  if(!V.app && !V.cc) history.pushState(st, ''); else history.replaceState(st, '');
  setView(st);
}
function sub(arg){
  const st = { app:V.app, arg };
  if(V.arg === undefined) history.pushState(st, ''); else history.replaceState(st, '');
  setView(st);
}
function openCC(){ history.pushState({ cc:1 }, ''); setView({ cc:1 }); }
function back(){ if(V.app || V.cc) history.back(); }
addEventListener('popstate', e => setView(e.state || {}));
function setView(st){
  const prev = V; V = st || {};
  if(prev.app === 'training' && prev.arg === 'step' && !(V.app === 'training' && V.arg === 'step')) trainLeave();
  if(V.app && !VIEWS[V.app]) V = {}; // e.g. a history entry for a removed app
  if(V.app && !prev.app) winAnim = true;
  if(V.cc && !prev.cc) ccAnim = true;
  if(!V.app) moving = false;
  confirmKey = null;
  render(true);
}

/* ---------- render ---------- */
function render(fresh){
  const a = document.activeElement, keep = !fresh && a && a.dataset && a.dataset.k;
  homeEl.innerHTML = homeHTML();
  homeEl.classList.toggle('behind', !!V.app);
  homeEl.classList.toggle('dimmed', !!V.cc);
  $('#wall').classList.toggle('under', !!(V.app || V.cc)); // keep windows readable over the video
  wallPlay();
  winEl.classList.toggle('open', !!V.app);
  winEl.innerHTML = V.app ? winHTML() : '';
  ccEl.classList.toggle('open', !!V.cc);
  ccEl.innerHTML = V.cc ? ccHTML() : '';
  winAnim = ccAnim = false;
  const scope = V.cc ? ccEl : V.app ? winEl : homeEl;
  const want = keep || (!V.app && !V.cc && restore[P.tab]);
  let el = want && scope.querySelector(`[data-k="${CSS.escape(want)}"]`);
  if(!el) el = scope.querySelector('[data-default]') || focusables(scope)[0];
  if(el){ el.focus({ preventScroll:true }); if(el.closest('.list')) el.scrollIntoView({ block:'nearest' }); }
}
const focusables = s => [...s.querySelectorAll('button,textarea,input,[tabindex="0"]')].filter(e => !e.disabled && e.getClientRects().length);

function discHTML(c1, c2, ink, inner, bgStyle){
  return `<span class="disc" style="--c1:${c1};--c2:${c2};color:${ink || '#fff'}"><span class="bg"${bgStyle ? ` style="background:${bgStyle}"` : ''}></span><span class="fg">${inner}</span></span>`;
}
/* honeycomb: rows of 3-4-3, centered on the area right of the tab bar */
function honey(n, rows, y0 = 120, dy = 134){
  rows = rows || (n === 7 ? [2,3,2] : n === 8 ? [3,2,3] : [3,4,3]);
  const out = []; let r = 0;
  while(out.length < n && r < rows.length){
    const cnt = rows[r];
    for(let i = 0; i < cnt && out.length < n; i++) out.push({ x:340 + (i - (cnt - 1) / 2) * 116, y:y0 + r * dy });
    r++;
  }
  return out;
}
/* circle: CENTER app in the middle, the others evenly around it starting at 12 o'clock */
const CENTER = 'notes';
function ring(apps, cx = 340, cy = 288, r = 164){
  const around = apps.filter(a => a.id !== CENTER), out = { [CENTER]:{ x:cx, y:cy } };
  around.forEach((a, i) => { const t = -Math.PI / 2 + i * 2 * Math.PI / around.length; out[a.id] = { x:cx + r * Math.cos(t), y:cy + r * Math.sin(t) }; });
  return out;
}

}

/* ---------- Training: SOP work instructions ----------
   The module itself lives in sop.js (an internal SOP, not published); without it Training shows an empty state. Each step has a short headline
   for the lens plus the SOP's own detail, notes and cautions. Time on each step is recorded (cycle time). */
const SOP = window.SOP || { title:'No training module', doc:'', ppe:[], tools:[], steps:[] };
const TR = () => P.train || (P.train = { cur:0, done:{}, times:{}, ppe:{}, tools:{}, start:0, stepAt:0, cure:0 });
const CURE_MS = 4 * 3600000;
function trainLeave(){ const t = TR(); if(t.stepAt){ t.times[t.cur] = (t.times[t.cur] || 0) + now() - t.stepAt; t.stepAt = 0; save(); } }
function trainGo(i){ const t = TR(); trainLeave(); t.cur = clamp(i, 0, SOP.steps.length - 1); t.stepAt = now(); if(!t.start) t.start = now(); save(); }
const doneCount = () => Object.keys(TR().done).length;
function cureText(){ const t = TR(); if(!t.cure) return ''; const left = t.cure + CURE_MS - now(); return left > 0 ? 'Handling strength in ' + fmtDur(left) : 'Handling strength reached ✓'; }
const chk = on => `<span class="chk ${on ? 'on' : ''}">${on ? svg('check') : ''}</span>`;

Object.assign(VIEWS, {
  training(arg){
    const t = TR(), n = SOP.steps.length, d = doneCount();
    if(arg === 'ppe') return `<div class="eyebrow">Training · Safety</div><div class="title">PPE check</div>
      <div class="sub" style="font-size:.92rem">Don’t start a step until its PPE is on.</div>
      <div class="list">${SOP.ppe.map((x, i) => `<button class="lrow" data-k="ppe-${i}" data-act="trainTick" data-v="ppe:${i}" ${i ? '' : 'data-default'} style="justify-content:flex-start;gap:14px">${chk(t.ppe[i])}<span style="font-size:1rem">${x}</span></button>`).join('')}</div>`;
    if(arg === 'tools'){ let k = 0;
      return `<div class="eyebrow">Training · Tools</div><div class="title">Tools & supplies</div>
      <div class="list">${SOP.tools.map(([g, items]) => `<div class="grp">${g}</div>` + items.map(x => { const id = k++; return `<button class="lrow" data-k="tool-${id}" data-act="trainTick" data-v="tools:${id}" ${id ? '' : 'data-default'} style="justify-content:flex-start;gap:14px;min-height:52px">${chk(t.tools[id])}<span style="font-size:1rem">${x}</span></button>`; }).join('')).join('')}</div>`; }
    if(arg === 'done'){
      const total = Object.values(t.times).reduce((a, b) => a + b, 0);
      let slow = -1; for(const k in t.times) if(slow < 0 || t.times[k] > t.times[slow]) slow = +k;
      return `<div class="eyebrow">Training complete</div><div class="center" style="gap:8px">${discHTML(...appBg('training'),'#fff',svg('training'))}
        <div class="title">Unit ready to ship</div><div class="sub">${d} of ${n} steps · total ${fmtDur(total)}</div>
        ${slow >= 0 ? `<div class="sub" style="font-size:.92rem">Longest step: ${SOP.steps[slow][1]} (${fmtDur(t.times[slow])})</div>` : ''}</div>
        <div class="row2"><button class="btn" data-k="tr-again" data-act="trainReset">${confirmKey === 'trreset' ? 'Pinch again' : 'Start over'}</button>
        <button class="btn primary" data-k="tr-home" data-act="close" data-default>Done</button></div>`;
    }
    if(arg === 'step'){
      const i = t.cur, [sec, head, det, call, ppe, cure] = SOP.steps[i];
      return `<div class="trk"><span>${sec}</span><span class="bar"><i style="width:${(100 * d / n).toFixed(1)}%"></i></span><span>${i + 1}/${n}</span></div>
        <div class="sttl">${t.done[i] ? '✓ ' : ''}${head}</div><div class="sdet">${det}</div>
        ${ppe ? `<div class="chips">${ppe.map(x => `<span>${x}</span>`).join('')}</div>` : ''}
        ${call ? `<div class="call ${call[0] === 'CAUTION' ? 'caution' : ''}"><b>${call[0]}</b>${call[1]}</div>` : ''}
        ${cure ? `<button class="lrow" data-k="tr-cure" data-act="trainCure" style="min-height:52px"><b>${t.cure ? 'Restart cure timer' : 'Start cure timer'}</b><span class="r" data-live="cure">${cureText() || '4:00:00'}</span></button>` : ''}
        <div class="row2" style="margin-top:auto;flex:0 0 auto"><button class="btn" data-k="tr-prev" data-act="trainStep" data-v="-1" ${i ? '' : 'disabled style="opacity:.4"'}>◀ Back</button>
          <button class="btn primary" data-k="tr-done" data-act="trainDone" data-default style="flex:1.6">${svg('check')}Done</button>

  },
  compass(){
    if(!C.on) return `<div class="eyebrow">Compass</div><div class="center">${discHTML(...appBg('compass'),'#fff',svg('compass'))}

      return `<line x1="${115 + r1 * Math.sin(a)}" y1="${115 - r1 * Math.cos(a)}" x2="${115 + 110 * Math.sin(a)}" y2="${115 - 110 * Math.cos(a)}" stroke="rgba(255,255,255,${i % 6 ? .35 : .8})" stroke-width="${i % 18 ? 1.5 : 3}"/>`; }).join('');

        <div class="sub">Feels ${Math.round(c.apparent_temperature)}° · H ${Math.round(dl.temperature_2m_max[0])}° L ${Math.round(dl.temperature_2m_min[0])}°</div>

        <button class="lrow" data-k="s-accent" data-spin="accent"><b>Accent color</b><span class="r" style="display:flex;gap:10px;align-items:center">◀ ${acc[0]} <i class="sw" style="background:${acc[1]}"></i> ▶</span></button>
        <button class="lrow" data-k="s-ts" data-spin="ts"><b>Text size</b><span class="r">◀ ${ts[0]} ▶</span></button>
        ${sliderHTML('bright', 'Brightness', 'sun', P.bright)}
        ${sliderHTML('wall', 'Wallpaper', 'motion', P.wall)}
        ${sliderHTML('see', 'Transparency', 'eye', P.see)}
        <button class="lrow" data-k="s-reduce" data-act="tile" data-v="reduce"><b>Reduce motion</b><span class="tog ${P.reduce ? 'on' : ''}"></span></button>

        <div class="title">${h(p.name)}</div><div class="sub">${h(p.city)} · ${tzDiff(p.tz)}</div>
        <div class="bigtime" style="font-size:4rem" data-live-tz="${p.tz}">${fmtTime(new Date(), p.tz)}</div>
        <div class="sub" data-live="pDay">${new Date().toLocaleDateString([], { weekday:'long', timeZone:p.tz })}</div></div>
      <div class="row2"><button class="btn danger" data-k="rmPerson" data-act="rmPerson" data-v="${i}">${confirmKey === 'rm' ? 'Pinch again' : 'Remove'}</button>
        <button class="btn primary" data-k="pDone" data-act="close" data-default>Done</button></div>`;
  },
  addPerson(){
    const [city, tz] = CITIES[D.city];
    return `<div class="eyebrow">People</div><div class="title">Add someone</div>
      <input type="text" data-k="pName" data-draft="name" value="${h(D.name)}" placeholder="Name (pinch to type)" autocomplete="off" aria-label="Name" data-default>
      <button class="spin" data-k="pCity" data-spin="city"><span class="ar">◀</span><span>${city} <span class="dim" style="font-weight:500">${fmtTime(new Date(), tz)}</span></span><span class="ar">▶</span></button>
      <div class="sub" style="text-align:center">Swipe left or right on the city to change it.</div>

/* ---------- Bluetooth Devices ----------
   Display Web Apps get no Bluetooth access: the glasses pair with the phone, and the Neural Band with
   the glasses, in the Meta AI app. So this screen reports what the app can observe and shows the real
   pairing steps instead of pretending to pair. */
const BAND = { last:0 };                     // last swipe/pinch input (Neural Band or the glasses' touchpad)
const onGlasses = () => innerWidth <= 600 && innerHeight <= 600 && !matchMedia('(hover: hover)').matches;
function ago(t){ const s = Math.round((now() - t) / 1000); return s < 3 ? 'just now' : s < 60 ? s + ' s ago' : Math.round(s / 60) + ' min ago'; }
function glassesState(){ return onGlasses() ? [true, 'Connected · running this app'] : [false, 'Not detected · open in a browser']; }
function bandState(){ return BAND.last ? [true, 'Active · input ' + ago(BAND.last)] : [false, 'Waiting · swipe or pinch to check']; }
const stHTML = ([ok, txt]) => `<i class="dot2 ${ok ? 'ok' : ''}"></i>${txt}`;
function btSummary(){ const n = glassesState()[0] + bandState()[0]; return n === 2 ? 'Both connected' : n + ' of 2 connected'; }
function btHTML(){
  const row = (k, icon, name, st) => `<button class="lrow dev" data-k="bt-${k}" data-act="btOpen" data-v="pair-${k}" ${k === 'glasses' ? 'data-default' : ''}>${svg(icon)}<span><b>${name}</b><span class="st" data-live="st-${k}">${stHTML(st)}</span></span><span class="r">Pair ›</span></button>`;
  return `<div class="eyebrow">Settings</div><div class="title">Bluetooth Devices</div>
    <div class="list">${row('glasses', 'glasses', 'Meta Ray-Ban Display', glassesState())}${row('band', 'band', 'Meta Neural Band', bandState())}</div>
    <div class="sub" style="font-size:.92rem">Pairing happens in the Meta AI app on your phone. Web apps can't use Bluetooth directly, so this screen shows each device's status and how to pair it.</div>`;
}
function pairHTML(arg){
  const band = arg === 'pair-band';
  const steps = band
    ? ['Put on the Meta Neural Band and make sure it is charged.', 'On your phone, open the Meta AI app and go to your glasses’ settings.', 'Choose <b>Meta Neural Band</b> and follow the steps to pair it with your glasses.', 'Come back here and swipe or pinch. The status below turns green.']
    : ['Turn on Bluetooth on your phone and open the Meta AI app.', 'Go to <b>Devices</b>, add your Meta Ray-Ban Display, and follow the steps.', 'To open this app on them, go to <b>Apps → Web Apps → Connect Web App</b> and paste its link.'];
  return `<div class="eyebrow">Bluetooth Devices</div><div class="title">Pair ${band ? 'Meta Neural Band' : 'Meta Ray-Ban Display'}</div>
    <ol class="steps">${steps.map(t => `<li>${t}</li>`).join('')}</ol>
    <div class="lrow dev" tabindex="0" data-k="pair-status">${svg(band ? 'band' : 'glasses')}<span><b>Status</b><span class="st" data-live="st-${band ? 'band' : 'glasses'}">${stHTML(band ? bandState() : glassesState())}</span></span></div>
    <button class="btn primary" data-k="pair-done" data-act="close" data-default style="flex:0 0 auto;margin-top:auto">Done</button>`;
}

/* ---------- live updates (4 Hz; the display runs at 30 Hz) ---------- */
function tick(){
  const d = new Date();
  if(P.timer.end && now() >= P.timer.end){ P.timer.end = null; P.timer.left = null; save(); toast('⏱ Timer done'); speak('Timer done'); if(V.app === 'clock' && V.arg === 'timer') render(); }
  set('status', statusHTML(), true);
  set('ccTime', fmtTime(d)); set('ccDate', fmtDate(d)); set('clockBig', fmtTime(d)); set('clockDate', fmtDate(d));
  document.querySelectorAll('[data-live-tz]').forEach(e => { const t = fmtTime(d, e.dataset.liveTz); if(e.textContent !== t) e.textContent = t; });
  if(V.app === 'clock' && V.arg === 'timer'){
    const left = timerLeft(), C2 = 2 * Math.PI * 96;
    set('timerLeft', fmtDur(left));
    const arc = q('timerArc'); if(arc) arc.setAttribute('stroke-dashoffset', (C2 * (1 - clamp(left / P.timer.dur, 0, 1))).toFixed(1));
  }
  if(V.app === 'clock' && V.arg === 'stopwatch') set('sw', fmtDur(swElapsed(), true));
  if(V.app === 'clockin' && !V.arg){ const u = PU(); set('punchState', punchState()); set('punchTime', fmtDur(workedNow())); if(u.in) set('punchBrk', 'Break ' + fmtDur(brkMs())); set('punchTotals', `Today ${hrs(workedSince(dayStart()))} · Week ${hrs(workedSince(weekStart()))} ›`); }
  if(V.app === 'training' && V.arg === 'step'){ const t = TR(); set('trtime', 'On this step ' + fmtDur(now() - (t.stepAt || now()))); if(t.cure) set('cure', cureText()); }
  if(V.app === 'settings'){ set('st-glasses', stHTML(glassesState()), true); set('st-band', stHTML(bandState()), true); set('btSummary', btSummary() + ' ›'); }
  if(V.app === 'compass' && C.on && C.heading != null){
    const hd = Math.round(C.heading), dial = q('dial');
    if(dial) dial.style.rotate = -hd + 'deg';
    set('heading', hd + '° ' + cardinal(hd) + (C.abs ? '' : ' (relative)')); set('level', levelText());
  }
}
const q = k => document.querySelector(`[data-live="${k}"]`);
function set(k, v, html){ const e = q(k); if(!e) return; if(html){ if(e.innerHTML !== v) e.innerHTML = v; } else if(e.textContent !== v) e.textContent = v; }
setInterval(tick, 250);

/* ---------- actions (pinch / Enter → click on the focused control) ---------- */
const ACT = {
  tab(v){ P.tab = v; save(); render(); focusKey('tab-' + v); },
  cc(){ openCC(); },
  app(v, b){ if(!V.app){ restore.apps = 'app-' + v; const r = b.getBoundingClientRect(), s = $('#stage').getBoundingClientRect(); ORIGIN = { x:r.left - s.left + r.width / 2, y:r.top - s.top + 44 }; }
    open(v); },
  close(){ back(); },
  grab(){ moving = !moving; toast(moving ? 'Swipe to move · pinch to drop' : 'Window placed'); },
  person(v, b){ restore.people = 'person-' + v; setOrigin(b); open('person', +v); },
  addPerson(v, b){ restore.people = 'person-add'; D = { name:'', city:1 }; setOrigin(b); open('addPerson'); },
  savePerson(){
    const name = D.name.trim(); if(!name){ toast('Add a name first'); return focusKey('pName'); }
    const [city, tz] = CITIES[D.city]; P.people.push({ name, city, tz }); save();
    restore.people = 'person-' + (P.people.length - 1); toast(name + ' added'); back();
  },
  rmPerson(v){ if(confirmKey !== 'rm'){ confirmKey = 'rm'; return; } const p = P.people.splice(+v, 1)[0]; save(); restore.people = 'person-add'; toast(p.name + ' removed'); back(); },
  tile(v){
    if(v === 'dnd'){ P.dnd = !P.dnd; toast(P.dnd ? 'Do Not Disturb on' : 'Do Not Disturb off'); }
    if(v === 'reduce'){ P.reduce = !P.reduce; }

/* ---------- Clock In: a shift time clock ----------
   Punches are kept on this device only (no payroll system behind it). Worked time excludes breaks. */
const PU = () => P.punch || (P.punch = { in:0, brk:0, brkAcc:0, log:[] });
const brkMs = () => { const u = PU(); return u.brkAcc + (u.brk ? now() - u.brk : 0); };
const workedNow = () => { const u = PU(); return u.in ? now() - u.in - brkMs() : 0; };
const dayStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return +d; };
const weekStart = () => { const d = new Date(dayStart()); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return +d; }; // Monday
const workedSince = t => PU().log.filter(e => e.in >= t).reduce((a, e) => a + e.out - e.in - e.brk, 0) + (PU().in >= t ? workedNow() : 0);
const hrs = ms => (ms / 3600000).toFixed(2) + ' h';
function punchState(){
  const u = PU();
  if(!u.in) return 'Off the clock';
  return u.brk ? 'On break since ' + fmtTime(new Date(u.brk)) : 'On the clock since ' + fmtTime(new Date(u.in));
}
Object.assign(VIEWS, {
  clockin(arg){
    const u = PU();
    if(arg === 'log'){
      const rows = u.log.slice().reverse().slice(0, 30).map((e, i) => {
        const a = new Date(e.in), b = new Date(e.out);
        return `<div class="lrow" tabindex="0" data-k="pl-${i}" ${i ? '' : 'data-default'}><b>${a.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' })}</b>
          <span class="r">${fmtTime(a)} – ${fmtTime(b)} · ${hrs(e.out - e.in - e.brk)}</span></div>`;
      }).join('');
      return `<div class="eyebrow">Clock In · Timesheet</div><div class="title">Past shifts</div>
        <div class="sub" style="font-size:.92rem">This week ${hrs(workedSince(weekStart()))}</div>
        <div class="list" style="margin-top:4px">${rows || `<div class="sub" style="text-align:center;padding:30px 0">No shifts yet</div>`}</div>`;
    }
    const btns = !u.in
      ? `<button class="btn primary" data-k="pu-in" data-act="punchIn" data-default style="flex:0 0 auto;min-height:70px;font-size:1.3rem">${svg('clockin')}Clock in</button>`
      : `<div class="row2" style="flex:0 0 auto"><button class="btn" data-k="pu-brk" data-act="punchBreak" ${u.brk ? 'data-default' : ''}>${u.brk ? 'End break' : 'Start break'}</button>
          <button class="btn danger" data-k="pu-out" data-act="punchOut" ${u.brk ? '' : 'data-default'}>${confirmKey === 'punchout' ? 'Pinch again' : 'Clock out'}</button></div>`;
    return `<div class="eyebrow">Clock In</div>
      <div class="center" style="gap:6px;flex:0 0 auto;margin:6px 0 4px">
        <div class="sub" data-live="punchState">${punchState()}</div>
        <div class="bigtime" data-live="punchTime" style="${u.in ? '' : 'opacity:.45'}">${fmtDur(workedNow())}</div>
        <div class="sub" style="font-size:.92rem" data-live="punchBrk">${u.in ? 'Break ' + fmtDur(brkMs()) : fmtDate(new Date())}</div>
      </div>
      ${btns}
      <div class="list" style="margin-top:8px;flex:0 0 auto">
        <button class="lrow" data-k="pu-log" data-act="punchLog"><b>Timesheet</b><span class="r" data-live="punchTotals">Today ${hrs(workedSince(dayStart()))} · Week ${hrs(workedSince(weekStart()))} ›</span></button>
      </div>`;
  },
});
Object.assign(ACT, {
  punchIn(){ const u = PU(); u.in = now(); u.brk = 0; u.brkAcc = 0; save(); toast('Clocked in · ' + fmtTime(new Date())); speak('Clocked in'); },
  punchBreak(){ const u = PU(); if(u.brk){ u.brkAcc += now() - u.brk; u.brk = 0; toast('Break over'); } else { u.brk = now(); toast('On break'); } save(); },
  punchOut(){
    if(confirmKey !== 'punchout'){ confirmKey = 'punchout'; return; }
    const u = PU(), b = brkMs(), worked = workedNow();
    u.log.push({ in:u.in, out:now(), brk:b }); if(u.log.length > 200) u.log.shift();
    u.in = 0; u.brk = 0; u.brkAcc = 0; save();
    toast('Clocked out · ' + hrs(worked)); speak('Clocked out');
  },
  punchLog(){ sub('log'); },
});

/* ---------- boot intro: the SiteVue AI logo pieces float in 3D, then assemble ---------- */
function runIntro(){
  const boot = $('#boot'), K = 480 / 3526, pcs = boot.querySelector('.pcs'), all = LOGO.map(p => p[4]).join('');
  // while flying, each piece is extruded: a bright face plus DEPTH darker layers stepping back along z
  const DEPTH = 6, side = j => { const t = (j - 1) / (DEPTH - 1), m = (a, b) => Math.round(a + (b - a) * t); return `rgb(${m(92, 23)},${m(99, 18)},${m(255, 122)})`; };
  boot.querySelector('defs').insertAdjacentHTML('beforeend', LOGO.map((p, i) => `<path id="lp${i}" d="${p[4]}" fill-rule="evenodd"/>`).join(''));
  pcs.innerHTML = LOGO.map(([x, y, w, hh], i) => {
    const vb = `viewBox="${x} ${y} ${w} ${hh}" aria-hidden="true"`;
    let ly = '';
    for(let j = DEPTH; j >= 1; j--) ly += `<svg class="ly" ${vb} style="transform:translateZ(calc(var(--dz) * -${j}))"><use href="#lp${i}" fill="${side(j)}"/></svg>`;
    ly += `<svg class="ly" ${vb}><use href="#lp${i}" fill="url(#bootFill)" stroke="rgba(255,255,255,.55)" stroke-width="5"/></svg>`;
    return `<div class="pc" style="left:${x * K}px;top:${y * K}px;width:${w * K}px;height:${hh * K}px">${ly}</div>`;
  }).join('');
  // finished logo: gradient letters, a white copy of each piece (lit as the light passes it), then the moving light on top
  boot.querySelector('.whole').innerHTML = `<path d="${all}" fill="url(#bootFill)" fill-rule="evenodd"/>`
    + LOGO.map((p, i) => `<use class="wh" href="#lp${i}" fill="#fff"/>`).join('')
    + `<path d="${all}" fill="url(#bootShine)" fill-rule="evenodd"/>`;
  homeEl.classList.add('boot');
  let done = false; const timers = [];
  const finish = () => {
    if(done) return; done = true;
    timers.forEach(clearTimeout); removeEventListener('keydown', skip, true); boot.removeEventListener('click', skip);
    boot.classList.add('out'); homeEl.classList.remove('boot');
    if(!P.reduce) homeEl.querySelectorAll('.icon').forEach((e, i) => e.animate([{ opacity:0, scale:.6 }, { opacity:1, scale:1 }],
      { duration:480, delay:120 + i * 45, easing:'cubic-bezier(.2,.9,.25,1.12)', fill:'backwards' }));
    setTimeout(() => boot.remove(), 700);
  };
  const skip = e => { e.preventDefault(); e.stopImmediatePropagation(); finish(); }; // a pinch skips; it must not also open an app
  addEventListener('keydown', skip, true); boot.addEventListener('click', skip);
  const whites = [...boot.querySelectorAll('.wh')];
  if(P.reduce){ boot.classList.add('lit'); timers.push(setTimeout(() => whites.forEach(w => w.classList.add('on')), 300), setTimeout(finish, 1500)); return; }
  const INTRO_MS = 2950; // drift in 1.1 s, float 0.75 s, snap together 1.1 s
  const rand = a => (Math.random() * 2 - 1) * a;
  const T = (x, y, z, a, b, c, k = 1) => `translate3d(${x}px,${y}px,${z}px) rotateX(${a}deg) rotateY(${b}deg) rotateZ(${c}deg) scale3d(${k},${k},${k})`;
  [...pcs.children].forEach((el, i) => {
    const x = rand(300), y = rand(250), z = -220 + Math.random() * 300, a = rand(70), b = rand(80), c = rand(120);
    el.animate([
      { transform:T(x * 1.3, y * 1.3, z - 1600, a - 40, b - 40, c - 60, 2), easing:'ease-out' },                // fly in from deep space
      { transform:T(x, y, z, a, b, c, 2), offset:.383, easing:'linear' },                                        // float, thick
      { transform:T(x * .85, y * .85, z * .8, a * .8, b * .8, c * .8, 1.7), offset:.638, easing:'cubic-bezier(.2,1.18,.4,1)' }, // snap, with a slight overshoot
      { transform:T(0, 0, 0, 0, 0, 0) }                                                                     // locked in face-on (the flat logo then replaces the pieces)
    ], { duration:INTRO_MS, delay:i * 38, fill:'both' });
  });
  const assembled = INTRO_MS + LOGO.length * 38 + 60, SWEEP_MS = 1900; // light crossing the logo (it grows meanwhile)
  const HOLD_MS = 3000; // the finished white logo stays on screen this long (a pinch still skips)
  boot.style.setProperty('--sweep', SWEEP_MS + 'ms'); $('#bootSweep').setAttribute('dur', SWEEP_MS / 1000 + 's');
  timers.push(setTimeout(() => { boot.classList.add('lit'); try { $('#bootSweep').beginElement(); } catch(e){} }, assembled));
  // the light's center moves linearly from x=-450 to x=4050 (logo units) over SWEEP_MS; a piece turns
  // white once the light has left it and reached the next letter (its right edge + a small gap)
  LOGO.forEach(([x, , w], i) => timers.push(setTimeout(() => whites[i].classList.add('on'),
    assembled + (x + w + 40 + 450) / 4500 * SWEEP_MS)));
  timers.push(setTimeout(finish, assembled + SWEEP_MS + HOLD_MS)); // linger on the white logo, then go to Home
}

/* ---------- boot ---------- */
const WALL_SPEED = 1; // the file is already slowed to 60% (600x600, 18 fps), so it plays at its native rate - cheaper to decode
// some browsers reset the rate when the source (re)loads
$('#wall').addEventListener('loadedmetadata', e => { e.target.defaultPlaybackRate = e.target.playbackRate = WALL_SPEED; });
function apply(){
  const r = document.documentElement.style;
  r.setProperty('--accent', P.accent); r.setProperty('--ts', P.ts); r.setProperty('--bright', P.bright);
  document.body.classList.toggle('reduce', P.reduce);
  r.setProperty('--wall', P.wall); r.setProperty('--see', P.see);
  const w = $('#wall');
  w.defaultPlaybackRate = w.playbackRate = WALL_SPEED;
  wallPlay();
}
// the video only plays on Home: it freezes (dimmed) behind app windows and Control Center, under Reduce Motion, and at 0%.
// Decoding it is the biggest steady cost on the glasses.
function wallPlay(){
  const w = $('#wall'); if(!w) return;
  if(P.reduce || P.wall <= 0 || V.app || V.cc) w.pause(); else if(w.paused) w.play().catch(() => {});
}
if(navigator.getBattery) navigator.getBattery().then(b => { BAT = b; b.addEventListener('levelchange', () => tick()); }).catch(() => {});
apply();
history.replaceState({}, '');
render(true);
runIntro();
</script>
